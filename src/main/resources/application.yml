server:
port: 8080

spring:
application:
name: bookwithticket
datasource:
    url: jdbc:h2:mem:bookwithticket;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  #redis
  data:
    redis:
      host: localhost
      port: 6379
    url: jdbc:mysql://localhost:3306/bookwithticket?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: multi
jpa:
hibernate:
      ddl-auto: create-drop
      ddl-auto: update
show-sql: true
properties:
hibernate:
        format_sql: true
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect