<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 주문 관리 | Booketing</title>
<script src="/js/order/admin-order.js" defer></script>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/order/admin-order.css">
</head>
<body class="bk-page bk-soft-page">
<div class="bk-wide-shell" style="padding-top:16px;">
    <header class="bk-topbar" style="margin-bottom:24px;">
        <a href="/mainpage.html" class="bk-brand">
            <span class="bk-logo">B</span>
            <span>Booketing</span>
        </a>
        <nav class="bk-nav">
            <a href="/mainpage.html">홈</a>
            <a href="/books.html">도서</a>
            <a href="/index.html">공연</a>
            <a href="/cart">장바구니</a>
            <a href="/history">구매내역</a>
            <a href="/mypage.html">마이페이지</a>
        </nav>
    </header>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid #e2e8f0; flex-wrap:wrap; gap:12px;">
        <h1 style="margin:0; font-size:1.6rem; color:#0f172a; font-weight:800;">📦 관리자 주문/예매 관리</h1>
        <button onclick="location.href='/admin.html'" style="background:#2563eb; color:#fff; padding:10px 20px; border-radius:8px; font-weight:700; font-size:0.9rem; border:none; cursor:pointer; box-shadow:0 2px 6px rgba(37,99,235,0.2); transition:all 0.15s;" onmouseover="this.style.background='#1d4ed8'" onmouseout="this.style.background='#2563eb'">
            📚 도서 관리자로 이동 ➔
        </button>
    </div>

	<div class="admin-tabs">
		<button type="button" id="book-tab" class="admin-tab active" onclick="changeAdminTab('book')">
			도서 주문</button>

		<button type="button" id="performance-tab" class="admin-tab"
			onclick="changeAdminTab('performance')"
		>공연 예매</button>
	</div>

	<section id="book-order-section">
		<table>
			<thead>
				<tr>
					<th>주문번호</th>
					<th>주문일</th>
					<th>구매자(회원번호)</th>
					<th>결제금액</th>
					<th>배송상태</th>
					<th>환불상태</th>
					<th>관리</th>
				</tr>
			</thead>

			<tbody id="order-list">
				<tr>
					<td colspan="7">판매 내역을 불러오는 중입니다.</td>
				</tr>
			</tbody>
		</table>
	</section>

	<section id="performance-order-section" style="display: none;">

		<table>
			<thead>
				<tr>
					<th>예매번호</th>
					<th>예매일</th>
					<th>예매자(회원번호)</th>
					<th>공연명</th>
					<th>공연일시</th>
					<th>좌석</th>
					<th>결제금액</th>
					<th>예매상태</th>
					<th>관리</th>
				</tr>
			</thead>

			<tbody id="performance-order-list">
				<tr>
					<td colspan="9">판매 내역을 불러오는 중입니다.</td>
				</tr>
			</tbody>
		</table>

	</section>

</div>

</body>
</html>
