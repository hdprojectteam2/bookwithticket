<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>주문자 정보 입력 | Booketing</title>
<script src="//t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script src="/js/kakao/kakao-address.js" defer></script>
<script src="https://js.tosspayments.com/v2/standard"></script>
<script src="/js/order/order.js" defer></script>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/common/common.css">
<link rel="stylesheet" href="/css/order/order.css">
</head>
<body class="bk-page bk-soft-page">
 
	<div class="container">
		<header class="bk-topbar">
			<a href="/mainpage.html" class="bk-brand"><span class="bk-logo">B</span><span>Booketing</span></a>
			<nav class="bk-nav">
				<a href="/books.html">도서</a> <a href="/index.html">공연</a> <a href="/cart" class="active">장바구니</a>
				<a href="/mypage.html">마이페이지</a>
			</nav>
		</header>
 

		<div id="back-area">
			<div onclick="back()">
				<span id="backBtn"><</span> <span id="backText">장바구니</span>
			</div>
			<span>></span> <span>배송지 입력</span>
		</div>

		<div class="order-page">

			<section class="order-left card">

				<div class="section-header">

					<h1>도서 주문</h1>

				</div>

				<div class="divider"></div>

				<section class="content-block">

					<h2 class="block-title">배송지 정보</h2>

					<button type="button" id="member-info-button" class="outline-btn">주문자 정보와 동일</button>

					<div class="form-group">

						<label for="recipient"> 주문자 정보 </label> <input type="text" id="recipient"
							placeholder="이름을 입력해주세요."
						>

					</div>

					<div class="form-group">

						<label for="phone"> 휴대전화번호 </label> <input type="text" id="phone"
							placeholder="휴대전화번호를 입력해주세요."
						>

					</div>

					<div class="form-group">

						<label for="zipcode"> 우편번호 </label>

						<div class="postcode-row">

							<input type="text" id="zipcode" readonly placeholder="우편번호">

							<button type="button" class="outline-btn" onclick="execDaumPostcode()">우편번호 찾기</button>

						</div>

					</div>

					<div class="form-group">

						<label for="address"> 주소 </label> <input type="text" id="address" readonly placeholder="주소">

					</div>

					<div class="form-group">

						<label for="detailAddress"> 상세주소 </label> <input type="text" id="detailAddress"
							placeholder="상세주소를 입력해주세요."
						>

					</div>

					<div class="form-group">

						<label for="deliveryRequest"> 배송 요청사항 </label> <input type="text" id="deliveryRequest"
							placeholder="배송 요청사항을 입력해주세요."
						>

					</div>

				</section>

				<div class="divider"></div>

			</section>

			<aside class="order-right card">

				<h2 class="summary-title">도서 주문 요약</h2>

				<div class="summary-row">

					<span> 선택 수량 </span> <strong id="summary-quantity"> 0개 </strong>

				</div>

				<div class="summary-row">

					<span>정가</span> <span id="summary-original-price"> 0원 </span>
			
				</div>

				<div class="summary-row">
			
					<span>할인 금액</span> <span id="summary-discount-price"> -0원 </span>
		
				</div>

				<div class="divider"></div>

				<div class="summary-total">

					<span> 최종 결제 금액 </span> <strong id="summary-total-price"> 0원 </strong>

				</div>

				<button type="button" class="primary-btn" id="payment-button" onclick="submitOrder()">
					결제하기</button>

				<div class="divider"></div>

				<p class="summary-notice">입력한 배송지 정보로 주문이 진행됩니다.</p>

			</aside>

		</div>
	</div>
</body>
</html>
