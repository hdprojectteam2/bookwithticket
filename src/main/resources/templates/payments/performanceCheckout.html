<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결제 | Booketing</title>
<script src="https://js.tosspayments.com/v2/standard"></script>
<script src="/js/payments/checkout.js" defer></script>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/payments/payment.css">
</head>
<body>
	<main class="payment-page">

		<div class="bk-page-heading">
			<span class="bk-eyebrow">PAYMENT</span>
			<h1>공연 결제</h1>
			<p>예매 정보를 확인하고 결제를 진행해주세요.</p>
		</div>

		<section class="payment-card">

			<h2>예매 정보</h2>

			<div id="payment-data" th:data-order-number="${orderNumber}"></div>

			<div class="payment-row">
				<span>예매번호</span> <strong id="order-number">-</strong>
			</div>

			<div class="payment-row">
				<span>공연명</span> <strong id="order-name">-</strong>
			</div>

			<div class="payment-row">
				<span>좌석</span> <strong id="seat-number">-</strong>
			</div>

			<div class="payment-divider"></div>

			<div class="payment-total">
				<span>최종 결제 금액</span> <strong> <span id="total-price">0</span>원
				</strong>
			</div>

			<button class="payment-button" id="payment-button" type="button" disabled>
				결제하기</button>

		</section>

	</main>
</body>
</html>
