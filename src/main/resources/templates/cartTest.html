<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<h1>@@@장바구니 테스트@@@@</h1>
	
	<div>
		<div>memberId 입력(장바구니 담기 전용 / DB 확인용)</div>
		<input type="number" id="memberId" value="1">
		<button onclick="changeMemberId()">변경</button>
		<p>
            현재 memberId:
            <span id="currentMemberId">1</span>
        </p>
	</div>
	
	<div>
		<div>임시 도서 상품 담기</div>
		<button onclick="addCartItem(1)">도서 담기(book_id=1)</button>
		<button onclick="addCartItem(2)">도서 담기(book_id=2)</button>	
		<button onclick="addCartItem(3)">도서 담기(book_id=3 / 품절)</button>
		<button onclick="addCartItem(4)">도서 담기(book_id=4 / 비활성화 도서)</button>
	</div>
	
	<div>
		<div>티켓 담기</div>
		<button onclick="addPerformance(1)">공연 담기(perfermance_id=1 / 오픈 전)</button>
		<button onclick="addPerformance(2)">공연 담기(perfermance_id=2 / 예매 중)</button>
		<button onclick="addPerformance(3)">공연 담기(perfermance_id=3 / 종료)</button>
	</div>
	<hr>
	
	<a href="/cart">장바구니 이동</a>
	
	<div>테스트용 예매 번호 생성</div>
	<input id="reservationNumber">
	<button onclick="moveToPerformancePayment()">공연 결제 페이지 이동</button>
	
	<hr>
	<a href="/history">구매내역 이동</a>
</body>
<script>

	/* 임시 도서 담기 */
	async function addCartItem(bookId) {
        const params = new URLSearchParams();

        params.append("memberId", getTestMemberId());
        params.append("bookId", String(bookId));
        params.append("quantity", "1");

        try {
            const response = await fetch("/api/cart/items", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: params
            });

            const message = await response.text();

            if (!response.ok) {
                console.error("서버 오류:", message);
                alert("장바구니 추가에 실패했습니다.");
                return;
            }

            alert(message);

        } catch (error) {
            console.error(error);
            alert("요청 중 오류가 발생했습니다.");
        }
    }
        
 	/*테스트 회원 변경 */
    function changeMemberId() {
        const memberIdInput = document.getElementById("memberId");

        const memberId = Number(memberIdInput.value);

        if (!Number.isInteger(memberId) || memberId < 1) {
            alert("회원 ID는 1 이상의 정수로 입력해주세요.");
            return;
        }

        localStorage.setItem("testMemberId", String(memberId));

        document.getElementById("currentMemberId").textContent = memberId;

    }
 	
 	/*현재 테스트 회원 ID 가져오기 */
    function getTestMemberId() {
        return localStorage.getItem("testMemberId") || "1";
    }
 	
 	/* 임시 공연 담기 */
 	async function addPerformance(performanceScheduleId) {
    const params = new URLSearchParams();

    params.append("memberId", getTestMemberId());

    params.append("performanceScheduleId", String(performanceScheduleId));

    try {
        const response = await fetch(
            "/api/cart/performances",
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },
                body: params
            }
        );

        const message = await response.text();

        if (!response.ok) {
            console.error("서버 오류:", message);

            alert(
                message ||
                "공연 장바구니 추가에 실패했습니다."
            );
            return;
        }

        alert(message);

    } catch (error) {
        console.error(error);

        alert("요청 중 오류가 발생했습니다.");
    }
    
    
}
 	
function moveToPerformancePayment() {
	const reservationNumber = document.getElementById("reservationNumber").value.trim();

	if (!reservationNumber) {
		alert("예매번호를 입력해주세요.");
		return;
	}
        
	location.href =  "/payments/checkout?orderNumber=" + encodeURIComponent(reservationNumber);
}
</script>
</html>
