<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>장바구니</title>
</head>
<body>
	<h1>장바구니</h1>

	<!-- 도서, 티켓 장바구니 탭 -->	
	<div>
		<div>장바구니 카테고리 변경 버튼</div>
	    <button type="button" onclick="cartTab('bookCart')">
	     	도서
	    </button>
	
	    <button type="button" onclick="cartTab('ticketCart')">
	        티켓
	    </button>
	</div>
	<hr>
	<!-- 도서 장바구니 -->
	<div id="bookCart">
	<!-- 장바구니가 비어있음 -->
	<div th:if="${#lists.isEmpty(cartItems)}">
		<p>장바구니가 비어있습니다</p>
	</div>
		<!-- 장바구니에 도서가 있음 -->
		<div th:unless="${#lists.isEmpty(cartItems)}">
			<div th:each="item : ${cartItems}">
				<!-- 임시 이미지 -->
				<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTvxq2V8QO4kB5KeiVR0p-LW7hBNCzAs5dUPvtGap4mxg&s=10" width="120" height="160">
				
				<p>
					도서명: <span th:text="${item.bookTitle}"/>
				</p>
				<p>
					저자: <span>@@임시 데이터@@</span>
				</p>
				<p>
					출판사: <span>@@임시 데이터@@</span>
				</p>
				<p>
					가격: <span th:text="${item.totalPrice}"/>
				</p>
				<p id="quantityBox">
					수량: 
					<span><button onclick="changeQuantity(this, -1)">-</button></span>
					<input type="number" min="1"
			   		th:value="${item.quantity}"
			   		th:data-cart-item-id="${item.cartItemId}"
			   		onchange="updateQuantity(this)">
					<span><button onclick="changeQuantity(this, 1)">+</button></span>
				</p>
				<button th:onclick="|deleteCartItem(${item.cartItemId})|" >도서 삭제</button>
			</div>
			<hr>
			<div>
				<p>
					총 상품 수량: <span th:text="${totalQuantity}"></span>
				</p>
				<p>
					총 결제 금액: <span th:text="${totalPrice}"/>
				</p>
				<button onclick="location.href='/order'">주문하기</button>
			</div>
		</div>
	</div>
	
	<!-- 공연 티켓 -->
	<div id="ticketCart" hidden>
		<p>현재 공연 장바구니가 비어 있습니다.</p>
	</div>
</body>
<script>
	// 도서, 티켓 탭 관리
	function cartTab(tabId) {
		const bookCart = document.getElementById("bookCart");
		const ticketCart = document.getElementById("ticketCart");

		bookCart.hidden = true;
		ticketCart.hidden = true;

		document.getElementById(tabId).hidden = false;
	}

	// 도서 수량 버튼
	function changeQuantity(button, amount) {
		const quantityBox = document.getElementById("quantityBox");
		const input = quantityBox.querySelector("input");

		const currentQuantity = Number(input.value);
		const newQuantity = currentQuantity + amount;

		if (newQuantity < 1) {
			alert("수량은 1개 이상이어야 합니다.");
			return;
		}
		
		if (newQuantity > 99) {
			alert("수량은 최대 99개까지 구매 가능합니다.");
			return;
		}

		input.value = newQuantity;
		updateQuantity(input);
	}

	// 도서 수량 변경
	function updateQuantity(input) {
		const cartItemId = input.dataset.cartItemId;
		const quantity = Number(input.value);

		if (!Number.isInteger(quantity) || quantity < 1) {
			alert("수량은 1 이상의 정수만 입력할 수 있습니다.");
			location.reload();
			return;
		}else if (quantity > 99) {
			alert("수량은 99개까지 입력할 수 있습니다.");
			location.reload();
			return;
		}

		const params = new URLSearchParams();
		params.append("quantity", quantity);

		fetch("/api/cart/items/" + cartItemId, {
			method: "PATCH",
			headers: {
				"Content-Type": "application/x-www-form-urlencoded"
			},
			body: params
		})
		.then(response => {
			if (!response.ok) {
				throw new Error("수량 변경에 실패했습니다.");
			}

			location.reload();
		})
		.catch(error => {
			alert(error.message);
			location.reload();
		});
	}
	
	// 도서 삭제 버튼
	function deleteCartItem(itemId){
		fetch("/api/cart/items/" + itemId, {
			method: "DELETE"
		})
		.then(response => {
			if(!response.ok){
				throw new Error("삭제에 실패했습니다.");				
			}
			location.reload();
		})
		.catch(error =>{
			alert(error.message);
		});
	}
</script>
</html>
