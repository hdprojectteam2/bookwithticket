<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서 상세 | Booketing</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/common/toast.css">
</head>

<body class="bk-page bk-book-detail-page">

<div class="bk-wide-shell">

    <header class="bk-topbar">

        <a href="/mainpage.html" class="bk-brand">
            <span class="bk-logo">B</span>
            <span>Booketing</span>
        </a>

        <nav class="bk-nav">
            <a href="/mainpage.html">홈</a>
            <a href="/books.html" class="active">도서</a>
            <a href="/mypage.html">마이페이지</a>
        </nav>

    </header>


    <main class="bk-detail-main">

        <div class="bk-breadcrumb">

            <a href="/books.html">
                도서
            </a>

            <span>›</span>

            <span id="breadcrumbTitle">
                상세
            </span>

        </div>


        <section class="bk-detail-hero">

            <div class="bk-detail-cover">

                <img
                        id="thumbnail"
                        alt="도서 표지"
                >

            </div>


            <div class="bk-detail-info">

                <span
                        id="category"
                        class="bk-eyebrow"
                ></span>


                <h1 id="title">
                    도서 정보를 불러오는 중입니다.
                </h1>


                <p class="bk-book-byline">

                    <span id="author"></span>

                    <span class="bk-dot">
                        ·
                    </span>

                    <span id="publisher"></span>

                </p>


                <div class="bk-review-summary">

                    <span class="bk-stars">
                        ★
                    </span>

                    <strong id="averageRating">
                        0.0
                    </strong>

                    <span id="reviewCount">
                        리뷰 0개
                    </span>

                </div>


                <div class="bk-detail-price">

                    <span
                            id="discountRate"
                            class="bk-discount-text"
                    ></span>

                    <strong>
                        <span id="salePrice"></span>원
                    </strong>

                    <del id="originalPrice"></del>

                </div>


                <div class="bk-detail-meta">

                    <div>
                        <span>재고</span>
                        <strong>
                            <span id="stock"></span>권
                        </strong>
                    </div>


                    <div>
                        <span>ISBN</span>
                        <strong id="isbn">
                            -
                        </strong>
                    </div>


                    <div>
                        <span>출간일</span>
                        <strong id="publishedDate">
                            -
                        </strong>
                    </div>


                    <div>
                        <span>분류</span>
                        <strong id="categoryText">
                            -
                        </strong>
                    </div>

                </div>


                <!-- =========================
                     구매 버튼
                ========================== -->

                <div class="bk-detail-actions">

                    <div class="bk-detail-actions-top">

                        <button
                                id="favoriteButton"
                                class="bk-detail-favorite"
                                type="button"
                                onclick="favorite()"
                        >
                            ♡ 관심 도서
                        </button>


                        <button
                                id="cartButton"
                                class="bk-detail-cart"
                                type="button"
                                onclick="cart()"
                        >
                            장바구니 담기
                        </button>

                    </div>


                    <button
                            id="buyButton"
                            class="bk-detail-buy"
                            type="button"
                            onclick="buyNow()"
                    >
                        구매하기
                    </button>

                </div>

            </div>

        </section>


        <!-- =========================
             연관 공연 안내 (BookWithTicket 연동)
        ========================== -->
        <section id="linkedPerformanceBox" class="bk-detail-section" style="display:none; background:linear-gradient(135deg, #f0f7ff, #ffffff); border:1px solid #bfdbfe; border-radius:18px; padding:26px 30px; margin-bottom:32px;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px;">
                <div>
                    <span class="bk-eyebrow" style="color:var(--bk-blue); margin-bottom:6px;">LINKED PERFORMANCE</span>
                    <h2 id="linkedPerfTitle" style="margin:0 0 8px 0; font-size:1.35rem; color:var(--bk-text);">-</h2>
                    <p id="linkedPerfVenue" class="bk-book-byline" style="margin:0; font-size:0.95rem; color:var(--bk-sub);">-</p>
                </div>
                <button id="linkedPerfBtn" type="button" class="bk-detail-buy" style="width:auto; padding:12px 24px; margin:0; border-radius:12px; background:linear-gradient(135deg, #3b82f6, var(--bk-blue)); font-size:0.95rem;">
                    공연 예매하기 ➔
                </button>
            </div>
        </section>


        <section class="bk-detail-section">

            <span class="bk-eyebrow">
                ABOUT BOOK
            </span>

            <h2>
                책 소개
            </h2>

            <p
                    id="description"
                    class="bk-description"
            ></p>

        </section>


        <section class="bk-detail-section">

            <div class="bk-section-head">

                <div>

                    <span class="bk-eyebrow">
                        REVIEWS
                    </span>

                    <h2>
                        리뷰
                    </h2>

                </div>

                <div
                        id="reviewInfo"
                        class="bk-review-info"
                ></div>

            </div>


            <div class="bk-reviews-layout">

                <div
                        id="reviewList"
                        class="bk-review-list"
                ></div>


                <aside class="bk-review-write">

                    <h3>
                        리뷰 작성
                    </h3>

                    <p>
                        읽은 책에 대한 의견을 남겨주세요.
                    </p>


                    <label for="rating">
                        평점
                    </label>

                    <select id="rating">

                        <option value="5">
                            ★★★★★ 5점
                        </option>

                        <option value="4">
                            ★★★★☆ 4점
                        </option>

                        <option value="3">
                            ★★★☆☆ 3점
                        </option>

                        <option value="2">
                            ★★☆☆☆ 2점
                        </option>

                        <option value="1">
                            ★☆☆☆☆ 1점
                        </option>

                    </select>


                    <label for="reviewContent">
                        내용
                    </label>

                    <textarea
                            id="reviewContent"
                            placeholder="리뷰를 작성해주세요"
                    ></textarea>


                    <button
                            id="reviewSubmitButton"
                            class="bk-primary bk-full"
                            type="button"
                            onclick="saveReview()"
                    >
                        리뷰 등록
                    </button>

                </aside>

            </div>

        </section>

    </main>

</div>


<script src="/js/book-detail.js"></script>

</body>
</html>
