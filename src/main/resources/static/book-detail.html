<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <title>도서 상세</title>

    <link rel="stylesheet" href="/css/style.css">

</head>


<body>


<h1>
    📖 도서 상세
</h1>





<div class="detail-container">



    <div class="book-image">


        <img id="thumbnail"
             width="250">


    </div>





    <div class="book-info">



        <h2 id="title"></h2>




        <p>
            저자 :
            <span id="author"></span>
        </p>



        <p>
            출판사 :
            <span id="publisher"></span>
        </p>




        <p>
            가격 :
            <span id="price"></span>
            원
        </p>




        <p>
            카테고리 :
            <span id="category"></span>
        </p>




        <p>
            재고 :
            <span id="stock"></span>
            개
        </p>





        <button onclick="favorite()">
            ❤️ 관심 도서
        </button>

        <button onclick="cart()">
            🛒 장바구니
        </button>

        <div id="linkedPerformanceBox" style="display:none; margin-top:15px; padding:12px; background:#e8f4fd; border:1px solid #3498db; border-radius:6px;">
            <p style="margin:0 0 8px 0; font-weight:bold; color:#2980b9; font-size:0.95rem;">🎭 이 책을 원작으로 한 공연/뮤지컬</p>
            <a id="linkedPerfBtn" href="#" style="display:inline-block; background:#8e44ad; color:#fff; padding:8px 15px; border-radius:4px; font-weight:bold; font-size:0.9rem; text-decoration:none;">공연 예매하러 가기 ➔</a>
        </div>

    </div>

</div>









<div class="description-box">



    <h2>
        📖 책 소개
    </h2>



    <p id="description"></p>



</div>









<!-- 리뷰 영역 -->

<div class="review-box">



    <h2>
        ⭐ 리뷰
    </h2>





    <!-- 평균 평점 -->

    <div id="reviewInfo">

    </div>






    <!-- 리뷰 목록 -->

    <div id="reviewList">


    </div>








    <hr>





    <!-- 리뷰 작성 -->


    <h3>
        리뷰 작성
    </h3>





    <select id="rating">


        <option value="5">
            ⭐⭐⭐⭐⭐
        </option>


        <option value="4">
            ⭐⭐⭐⭐
        </option>


        <option value="3">
            ⭐⭐⭐
        </option>


        <option value="2">
            ⭐⭐
        </option>


        <option value="1">
            ⭐
        </option>


    </select>








    <textarea

            id="reviewContent"

            placeholder="리뷰를 작성해주세요">

    </textarea>








    <button onclick="saveReview()">


        리뷰 등록


    </button>




</div>









<script src="/js/book-detail.js"></script>



</body>

</html>
