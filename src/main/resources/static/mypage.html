<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <title>마이페이지</title>

    <link rel="stylesheet" href="/css/style.css">

</head>


<body>


<h1>마이페이지</h1>



<div class="mypage-container">



    <h2>
        👤 <span id="memberName"></span>님
    </h2>




    <section class="member-box">


        <h3>
            회원 정보
        </h3>


        <p>
            이메일 :
            <span id="email"></span>
        </p>


        <p>
            이름 :
            <span id="name"></span>
        </p>


        <p>
            전화번호 :
            <span id="phone"></span>
        </p>


        <p>
            주소 :
            <span id="address"></span>
        </p>



        <button onclick="goUpdate()">
            회원정보 수정
        </button>


    </section>






    <section class="member-box">


        <h3>
            나의 도서 활동
        </h3>


        <button>
            📖 최근 본 도서
        </button>


        <button>
            ❤️ 관심 도서
        </button>



    </section>






    <section class="member-box">


        <h3>
            계정 관리
        </h3>



        <button onclick="logout()">
            🚪 로그아웃
        </button>



        <button onclick="deleteMember()">
            ❌ 회원 탈퇴
        </button>



    </section>



</div>





<script src="/js/member.js"></script>


</body>

</html>
