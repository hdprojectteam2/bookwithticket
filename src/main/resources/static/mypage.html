<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마이페이지 | Booketing</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="bk-page bk-soft-page">
	<div class="bk-wide-shell">
		<header class="bk-topbar">
			<a href="/mainpage.html" class="bk-brand"><span class="bk-logo">B</span><span>Booketing</span></a>
			<nav class="bk-nav">
				<a href="/mainpage.html">홈</a>
				<a href="/books.html">도서</a>
				<a href="/index.html">공연</a>
				<a href="/cart">장바구니</a>
				<a href="/history">구매내역</a>
				<a href="/mypage.html" class="active">마이페이지</a>
			</nav>
		</header>

		<main class="bk-mypage-main">
			<div class="bk-page-heading">
				<span class="bk-eyebrow">MY BOOKETING</span>
				<h1>
					<span id="memberName"></span>님의 마이페이지
				</h1>
				<p>회원정보와 나의 도서 활동, 예매 내역을 한곳에서 확인해보세요.</p>
			</div>

			<div class="bk-mypage-layout">
				<aside class="bk-card bk-profile-card">
					<div class="bk-avatar">B</div>
					<h2 id="name">-</h2>
					<p id="email">-</p>
					<dl class="bk-profile-list">
						<div>
							<dt>전화번호</dt>
							<dd id="phone">-</dd>
						</div>
						<div>
							<dt>주소</dt>
							<dd id="address">-</dd>
						</div>
					</dl>
					<div class="bk-profile-actions">
						<button class="bk-primary" type="button" onclick="goUpdate()">회원정보 수정</button>
						<button class="bk-secondary" type="button" onclick="logout()">로그아웃</button>
						<button class="bk-danger-link" type="button" onclick="deleteMember()">회원 탈퇴</button>
					</div>
				</aside>

				<div class="bk-mypage-content">
					<section class="bk-card">
						<div class="bk-section-head">
							<div>
								<span class="bk-eyebrow">BOOK ACTIVITY</span>
								<h2>나의 도서 활동</h2>
							</div>
							<a href="/books.html" class="bk-text-link">도서 둘러보기 →</a>
						</div>

						<div class="bk-activity-block">
							<h3>최근 본 도서</h3>
							<div id="recentBooks" class="bk-mini-book-grid"></div>
						</div>
						<div class="bk-activity-block">
							<h3>관심 도서</h3>
							<div id="favoriteBooks" class="bk-mini-book-grid"></div>
						</div>
						<div class="bk-activity-block">
							<h3>내가 작성한 리뷰</h3>
							<div id="myReviews" class="bk-review-list"></div>
						</div>
					</section>

					<section class="bk-card">
						<div class="bk-section-head">
							<div>
								<span class="bk-eyebrow">RESERVATION</span>
								<h2>나의 공연 예매 내역</h2>
							</div>
							<label class="bk-check bk-compact-check"><input type="checkbox"
								id="showAllHistoryToggle" onchange="loadMyPerformanceReservations()"
							><span>취소 내역 포함</span></label>
						</div>
						<div id="myPerformanceReservations">
							<p class="bk-empty-text">예매 내역을 불러오는 중입니다.</p>
						</div>
					</section>
				</div>
			</div>
		</main>
	</div>
	<script src="/js/member.js"></script>
	<script>
    document.addEventListener('DOMContentLoaded', loadMyPerformanceReservations);
    async function loadMyPerformanceReservations() {
        const token = localStorage.getItem('token') || localStorage.getItem('accessToken');
        const container = document.getElementById('myPerformanceReservations');
        const showAll = document.getElementById('showAllHistoryToggle')?.checked || false;
        if (!container) return;
        if (!token || token === 'undefined') { container.innerHTML = '<p class="bk-error-text">로그인이 필요합니다.</p>'; return; }
        try {
            const response = await fetch('/api/reservations/my', {headers:{'Authorization':`Bearer ${token}`}});
            const result = await response.json();
            if (!response.ok || !result.data) { container.innerHTML='<p class="bk-empty-text">예매 내역이 없습니다.</p>'; return; }
            let reservations=(result.data||[]).filter(r=>r.status!=='EXPIRED');
            if(!showAll) reservations=reservations.filter(r=>r.status==='HELD'||r.status==='CONFIRMED');
            if(!reservations.length){container.innerHTML='<p class="bk-empty-text">예매 내역이 없습니다.</p>';return;}
            container.innerHTML='<div class="bk-reservation-list">'+reservations.map(r=>{
                const status={HELD:'선점 중',CONFIRMED:'예매 완료',CANCELED:'취소됨',EXPIRED:'시간 만료'}[r.status]||r.status;
                const cls={HELD:'held',CONFIRMED:'confirmed',CANCELED:'canceled',EXPIRED:'canceled'}[r.status]||'canceled';
                const time=r.performanceTime?new Date(r.performanceTime).toLocaleString('ko-KR'):'-';
                const cancel=r.status==='HELD'||r.status==='CONFIRMED'?`<button class="bk-secondary bk-small-btn" onclick="cancelMyReservation(${r.id}, '${r.status}')">${r.status==='HELD'?'선점 취소':'예매 취소'}</button>`:'';
                return `<article class="bk-reservation-item"><div class="bk-reservation-main"><div class="bk-reservation-top"><strong>예매 #${r.id}</strong><span class="bk-status ${cls}">${status}</span></div><h3>${r.performanceTitle||'공연'}</h3><p>${time} · 좌석 ${r.seatNumber||'-'} · ${Number(r.price||0).toLocaleString()}원</p></div>${cancel}</article>`;
            }).join('')+'</div>';
        } catch(e){container.innerHTML='<p class="bk-error-text">예매 내역을 불러오지 못했습니다.</p>';}
    }
    async function cancelMyReservation(reservationId,currentStatus){
        const msg=currentStatus==='CONFIRMED'?`예매 번호 #${reservationId} 건을 결제 취소 및 환불하시겠습니까?`:`예매 번호 #${reservationId} 건의 좌석 선점을 취소하시겠습니까?`;
        if(!confirm(msg)) return;
        const token=localStorage.getItem('token')||localStorage.getItem('accessToken');
        try{
        	let response;
            if (currentStatus === 'CONFIRMED') {
            	window.open(`/refund.html?type=performance&id=${encodeURIComponent(`PERF_${reservationId}`)}`, "_blank", "width=500,height=600");
            	return;
            } else {
            	response = await fetch(
                    `/api/reservations/${reservationId}/cancel`,
                    {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${token}`
                        }
                    }
                );
            }
            const result=await response.json().catch(()=>({}));
            if(!response.ok) throw new Error(result.message||'취소에 실패했습니다.');
            alert(currentStatus==='CONFIRMED'?'예매 취소 및 환불이 완료되었습니다.':'좌석 선점이 취소되었습니다.');
            loadMyPerformanceReservations();
        }catch(e){alert(e.message);}
    }
</script>
</body>
</html>
