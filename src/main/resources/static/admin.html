<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <title>관리자 페이지</title>

    <link rel="stylesheet" href="/css/style.css">

</head>


<body>


<h1>
    관리자 도서 관리
</h1>



<section>


    <h2>
        도서 등록
    </h2>


    <input id="isbn" placeholder="ISBN">

    <input id="title" placeholder="제목">

    <input id="author" placeholder="저자">

    <input id="publisher" placeholder="출판사">

    <input id="price" placeholder="가격">

    <input id="thumbnail" placeholder="이미지 URL">

    <input id="category" placeholder="카테고리">

    <input id="stock" placeholder="재고">


    <textarea id="description"
              placeholder="책 소개">
</textarea>



    <button onclick="saveBook()">

        등록

    </button>


</section>





<hr>





<section>


    <h2>
        도서 목록
    </h2>


    <div id="bookList">

    </div>


</section>



<script src="/js/admin.js"></script>

<div style="position:fixed; top:15px; left:15px; z-index:9999; display:flex; gap:10px;">
    <button onclick="location.href='/mainpage.html'" style="background:#34495e; color:#fff; border:none; padding:8px 16px; cursor:pointer; font-weight:bold; box-shadow:0 2px 5px rgba(0,0,0,0.2);">메인페이지로 이동</button>
    <button onclick="location.href='/admin/orders'" style="background:#27ae60; color:#fff; border:none; padding:8px 16px; cursor:pointer; font-weight:bold; box-shadow:0 2px 5px rgba(0,0,0,0.2);">주문/배송 관리자 이동</button>
</div>

</body>

</html>
