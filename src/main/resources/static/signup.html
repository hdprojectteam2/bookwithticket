<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <title>회원가입</title>

    <link rel="stylesheet" href="/css/style.css">

</head>


<body>

<div style="margin-bottom: 15px;">
    <a href="/mainpage.html" style="font-size: 1.3rem; font-weight: bold; color: #2c3e50; text-decoration: none;">BookWithTicket</a>
</div>

<h1>회원가입</h1>



<div class="signup-box">


    <!-- 이메일 -->

    <div>
        <label>이메일</label>

        <input
                id="email"
                type="email"
                placeholder="이메일 입력"
        >

        <button onclick="checkEmail()">
            중복 확인
        </button>

        <p id="emailCheck"></p>

    </div>





    <!-- 비밀번호 -->

    <div>

        <label>비밀번호</label>

        <input
                id="password"
                type="password"
                placeholder="비밀번호"
        >

        <small>
            비밀번호는 8~64자로 입력해주세요.
        </small>

    </div>





    <!-- 비밀번호 확인 -->

    <div>

        <label>비밀번호 확인</label>

        <input
                id="passwordCheck"
                type="password"
                placeholder="비밀번호 확인"
        >

    </div>





    <!-- 이름 -->

    <div>

        <label>이름</label>

        <input
                id="name"
                type="text"
                placeholder="이름"
        >

    </div>





    <!-- 전화번호 -->

    <div>

        <label>휴대폰 번호</label>

        <input
                id="phone"
                type="text"
                placeholder="010-0000-0000"
        >

    </div>





    <!-- 주소 -->

    <div>

        <label>주소</label>

        <input
                type="text"
                id="zipcode"
                placeholder="우편번호"
                readonly
        >

        <button
                type="button"
                onclick="execDaumPostcode()"
        >
            주소 검색
        </button>

        <input
                type="text"
                id="address"
                placeholder="주소"
                readonly
        >

        <input
                type="text"
                id="detailAddress"
                placeholder="상세주소"
        >

    </div>






    <!-- 약관 -->

    <div>


        <label>

            <input
                    id="agree"
                    type="checkbox"
            >

            이용약관 동의 (필수)

        </label>



    </div>




    <div>


        <label>

            <input
                    id="marketingAgree"
                    type="checkbox"
            >

            마케팅 정보 수신 동의 (선택)

        </label>



    </div>





    <button onclick="signup()">

        가입하기

    </button>



</div>





<script src="/js/signup.js"></script>
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script src="/js/kakao/kakao-address.js"></script>

</body>

</html>
