<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookWithTicket - 공연 예매 및 좌석 선택</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; text-decoration: none !important; }
        body { background-color: #f8f9fa; margin: 0; padding: 20px; color: #212529; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h1 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 15px; font-size: 1.6rem; }
        .section { margin-bottom: 30px; }
        h2 { color: #34495e; font-size: 1.2rem; margin-bottom: 12px; }
        .search-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; font-size: 1rem; border-radius: 4px; }
        button { background: #3498db; color: #fff; border: none; padding: 10px 18px; cursor: pointer; font-weight: bold; transition: 0.2s; border-radius: 4px; }
        button:hover { background: #2980b9; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .card { border: 1px solid #e0e0e0; padding: 15px; background: #fafafa; cursor: pointer; transition: 0.2s; border-radius: 6px; }
        .card:hover { border-color: #3498db; background: #f0f7fc; transform: translateY(-2px); }
        .card h3 { margin: 0 0 8px 0; color: #2c3e50; }
        .badge { display: inline-block; background: #e8f4fd; color: #3498db; padding: 3px 8px; border-radius: 3px; font-size: 0.8rem; font-weight: bold; }
        .seats-grid { width: 100%; max-width: 900px; margin: 15px auto 0 auto; }
        .seat-btn { padding: 15px; text-align: center; cursor: pointer; font-weight: bold; color: #fff; border: none; border-radius: 4px; }
        .seat-available { background: #2ecc71; }
        .seat-held { background: #f39c12; }
        .seat-reserved { background: #e74c3c; }
        .log-box { background: #1e1e1e; color: #a9dfbf; padding: 15px; font-family: monospace; height: 160px; overflow-y: auto; font-size: 0.85rem; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎭 공연 예매 및 실시간 좌석 선점</h1>

    <!-- 계정 스왑 및 관리자 툴바 -->
    <div style="background:#f8f9fa; border:1px solid #ddd; padding:15px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <div style="display:flex; align-items:center; gap:10px;">
            <button onclick="location.href='/mainpage.html'" style="background:#34495e; color:#fff; border:none; padding:6px 12px; font-size:0.85rem; cursor:pointer; font-weight:bold;">메인페이지로 이동</button>
            <span style="font-weight:bold;">테스트 계정 스왑:</span>
            <button onclick="switchAccount('USER')" style="background:#27ae60; padding:6px 12px; font-size:0.85rem;">일반 사용자 모드 (USER)</button>
            <button onclick="switchAccount('ADMIN')" style="background:#8e44ad; padding:6px 12px; font-size:0.85rem;">관리자 모드 (ADMIN)</button>
        </div>
        <div>
            <span id="userRoleBadge" style="padding:5px 12px; background:#2c3e50; color:#fff; font-weight:bold; font-size:0.85rem; border-radius:3px;">현재 권한: USER</span>
        </div>
    </div>

    <!--검색-->
    <div class="section">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <h2 style="margin:0;">공연 검색, 목록</h2>
            <div style="display:flex; gap:8px;">
                <button id="adminImportBtn" onclick="importFromKopis()" style="background:#2980b9; display:none;">+ KOPIS 공연 수집 (관리자)</button>
                <button id="adminCreateBtn" onclick="openAdminCreateModal()" style="background:#8e44ad; display:none;">+ 공연 신규 등록 (관리자)</button>
            </div>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="제목입력" onkeyup="if(event.key === 'Enter') loadPerformances();">
            <button onclick="loadPerformances()">검색</button>
            <button onclick="document.getElementById('searchInput').value=''; currentCategory=null; setActiveCategory(null); loadPerformances();" style="background:#95a5a6;">전체보기</button>
        </div>
        <!-- 카테고리 필터 -->
        <div style="display:flex; gap:8px; margin-bottom:15px; flex-wrap:wrap;">
            <button id="cat-MUSICAL"  onclick="selectCategory('MUSICAL')"  style="background:#8e44ad;">뮤지컬</button>
            <button id="cat-CONCERT"  onclick="selectCategory('CONCERT')"  style="background:#c0392b;">콘서트</button>
            <button id="cat-CLASSIC"  onclick="selectCategory('CLASSIC')"  style="background:#16a085;">클래식</button>
            <button id="cat-EXHIBITION" onclick="selectCategory('EXHIBITION')" style="background:#d35400;">전시</button>
        </div>
        <div id="performanceList" class="grid">로딩</div>
    </div>

    <!-- 회차 좌석 선택, 밑에 loadPerformances 에서 실행됨  -->
    <div class="section" id="seatSection" style="display:none;">
        <h2> 회차 선택과 좌석 선점 (<span id="selectedPerfTitle" style="color:#3498db;"></span>)</h2>
        <div id="scheduleList" style="margin-bottom:15px;"></div>
        <div id="seatArea" style="display:none;">
            <h3>좌석 선택 (<span style="color:#2ecc71;">GREEN</span> 예매가능 | <span style="color:#f39c12;">YELLOW</span> 10분선점 | <span style="color:#e74c3c;">RED</span> 예매완료)</h3>
            <div id="seatsGrid" class="seats-grid"></div>
        </div>
    </div>

    <!-- 결과확인용 -->
    <div class="section">
        <h2>로그</h2>
        <div id="logBox" class="log-box">로드 완료 </div>
    </div>
</div>

<!-- 선점 좌석 & 결제 모달 -->
<div id="customModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#fff; padding:25px; width:400px; text-align:center; border:1px solid #ccc; border-radius:8px;">
        <h3 id="modalTitle" style="margin-top:0; color:#2c3e50;">선점된 좌석 결제</h3>
        <p id="modalDesc" style="color:#666; font-size:0.85rem; margin-bottom:10px;">10분간 선점된 좌석입니다. 결제 방식을 선택하세요.</p>
		<p id="modalTimer" style="margin:10px 0; line-height:1.4; font-weight:bold; color:#e74c3c;"></p>
        <div style="display:flex; flex-direction:column; gap:8px; margin-top:15px;">
            <button id="btnTossPay" onclick="goToTossCheckout()" style="background:#0064FF; color:#fff; padding:10px; font-weight:bold; border-radius:4px;">Toss Payments 결제창 이동</button>
            <button id="btnConfirm" onclick="handleModalAction('confirm')" style="background:#2ecc71; color:#fff; padding:10px; font-weight:bold; border-radius:4px;">테스트 간편 결제 (즉시 승인)</button>
            <button id="btnCancel" onclick="handleModalAction('cancel')" style="background:#e74c3c; color:#fff; padding:8px; border-radius:4px;">선점 취소</button>
            <button onclick="closeCustomModal()" style="background:#95a5a6; color:#fff; padding:8px; border-radius:4px;">닫기</button>
        </div>
    </div>
</div>

<!-- 관리자 공연 신규 등록 모달 -->
<div id="adminCreateModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#fff; padding:25px; width:450px; border:1px solid #ccc; max-height:90vh; overflow-y:auto;">
        <h3 style="margin-top:0; color:#8e44ad; border-bottom:1px solid #eee; padding-bottom:10px;">+ 공연 신규 등록 (관리자)</h3>
        <div style="display:flex; flex-direction:column; gap:12px; text-align:left;">
            <label><b>공연 제목:</b> <input type="text" id="newTitle" placeholder="예: 뮤지컬 웃는남자" style="width:100%; padding:8px;"></label>
            <label><b>카테고리:</b> 
                <select id="newCategory" style="width:100%; padding:8px;">
                    <option value="MUSICAL">MUSICAL (뮤지컬)</option>
                    <option value="CONCERT">CONCERT (콘서트)</option>
                    <option value="CLASSIC">CLASSIC (클래식)</option>
                    <option value="EXHIBITION">EXHIBITION (전시)</option>
                </select>
            </label>
            <label><b>공연장:</b> <input type="text" id="newVenue" placeholder="예: 예술의전당 오페라극장" style="width:100%; padding:8px;"></label>
            <label><b>포스터 URL:</b> <input type="text" id="newPosterUrl" placeholder="https://example.com/poster.jpg" style="width:100%; padding:8px;"></label>
            <label><b>러닝타임 (분):</b> <input type="number" id="newRuntime" value="150" style="width:100%; padding:8px;"></label>
            <label><b>원작 도서 ID (선택):</b> <input type="number" id="newOriginalBookId" placeholder="예: 1" style="width:100%; padding:8px;"></label>
            <label><b>상세 설명:</b> <textarea id="newDescription" placeholder="공연 정보를 입력하세요" style="width:100%; height:80px; padding:8px;"></textarea></label>
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px;">
            <button onclick="submitAdminCreatePerformance()" style="background:#8e44ad;">등록하기</button>
            <button onclick="closeAdminCreateModal()" style="background:#95a5a6;">취소</button>
        </div>
    </div>
</div>

<!-- 관리자 회차 및 좌석 생성 모달 -->
<div id="adminScheduleModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#fff; padding:25px; width:450px; border:1px solid #ccc; max-height:90vh; overflow-y:auto;">
        <h3 style="margin-top:0; color:#8e44ad; border-bottom:1px solid #eee; padding-bottom:10px;">+ 회차 및 좌석 배치 생성 (관리자)</h3>
        <p style="color:#666; font-size:0.85rem;">공연: <b id="schModalPerfTitle" style="color:#3498db;"></b></p>
        <div style="display:flex; flex-direction:column; gap:12px; text-align:left;">
            <label><b>공연 일시:</b> <input type="datetime-local" id="newPerfTime" style="width:100%; padding:8px;"></label>
            <label><b>티켓 오픈 일시:</b> <input type="datetime-local" id="newOpenTime" style="width:100%; padding:8px;"></label>
            <label><b>생성할 총 좌석 수:</b> <input type="number" id="newTotalSeats" value="1241" min="1" max="50000" style="width:100%; padding:8px;"></label>
            <label><b>좌석 단가 (원):</b> <input type="number" id="newSeatPrice" value="150000" step="10000" style="width:100%; padding:8px;"></label>
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px;">
            <button onclick="submitAdminScheduleAndSeats()" style="background:#8e44ad;">회차 및 좌석 생성</button>
            <button onclick="closeAdminScheduleModal()" style="background:#95a5a6;">취소</button>
        </div>
    </div>
</div>

<!-- 관리자 KOPIS 공연 검색 및 선택 수집 모달 -->
<div id="adminKopisModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#fff; padding:25px; width:650px; border:1px solid #ccc; max-height:85vh; overflow-y:auto; text-align:left;">
        <h3 style="margin-top:0; color:#2980b9; border-bottom:1px solid #eee; padding-bottom:10px;">+ KOPIS 공연 데이터 선택 수집 (관리자)</h3>
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <input type="text" id="kopisSearchKeyword" placeholder="검색어 (예: 뮤지컬, 콘서트, 캣츠)" style="flex:1; padding:8px;" onkeyup="if(event.key==='Enter') executeKopisSearch();">
            <button onclick="executeKopisSearch()" style="background:#2980b9;">조회</button>
        </div>
        <div id="kopisSearchResultArea" style="max-height:400px; overflow-y:auto; border:1px solid #eee; padding:10px; margin-bottom:15px;">
            <p style="color:#888; text-align:center;">검색어를 입력하고 [조회] 버튼을 클릭하세요.</p>
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end;">
            <button onclick="submitSelectedKopisImport()" style="background:#27ae60;">선택한 공연 DB 수집</button>
            <button onclick="closeAdminKopisModal()" style="background:#95a5a6;">닫기</button>
        </div>
    </div>
</div>

<script>
    let currentScheduleId = null;
    let lastReservationId = null;
    let lastHoldExpiresAt = null;
    let modalTimerInterval = null;
    let currentCategory = null;
    let currentRole = 'USER';

    let currentPerfId = null;
    let currentPerfTitle = '';
    let myReservationIds = [];

    async function fetchMyReservationIds() {
        myReservationIds = [];
        let token = localStorage.getItem('token') || localStorage.getItem('accessToken');
        if (!token || token === 'undefined') return;
        try {
            const res = await fetch('/api/reservations/my', {
                headers: getAuthHeaders()
            });
            if (res.ok) {
                const data = await res.json();
                if (data && Array.isArray(data.data)) {
                    myReservationIds = data.data
                        .filter(r => r.status === 'HELD' || r.status === 'CONFIRMED')
                        .map(r => r.id);
                }
            }
        } catch (e) {
            console.error('내 예매 목록 로드 에러:', e);
        }
    }

    function openAdminCreateModal() {
        document.getElementById('adminCreateModal').style.display = 'flex';
    }

    function closeAdminCreateModal() {
        document.getElementById('adminCreateModal').style.display = 'none';
    }

    async function openAdminScheduleModal(perfId, perfTitle) {
        currentPerfId = perfId;
        currentPerfTitle = perfTitle;
        document.getElementById('schModalPerfTitle').innerText = perfTitle || '';
        document.getElementById('adminScheduleModal').style.display = 'flex';
        try {
            const res = await fetch(`/api/performances/${perfId}`);
            const data = await res.json();
            if (res.ok && data.success && data.data) {
                const scale = data.data.seatscale || 1241;
                document.getElementById('newTotalSeats').value = scale;
                log(`[API 연동 완료] ${perfTitle} 공연의 실제 좌석 수 (${scale}석) 자동 호출 완료`);
            }
        } catch (e) {
            console.error('공연 상세 조회 에러:', e);
        }
    }

    function closeAdminScheduleModal() {
        document.getElementById('adminScheduleModal').style.display = 'none';
    }

    async function submitAdminScheduleAndSeats() {
        const perfTimeVal = document.getElementById('newPerfTime').value;
        const openTimeVal = document.getElementById('newOpenTime').value;
        const totalSeats = parseInt(document.getElementById('newTotalSeats').value) || 0;
        const seatPrice = parseInt(document.getElementById('newSeatPrice').value) || 150000;

        if (!perfTimeVal || !openTimeVal) {
            alert('공연 일시와 티켓 오픈 일시는 필수 입력값입니다.');
            return;
        }

        try {
            const res = await fetch(`/api/performances/${currentPerfId}/schedules`, {
                method: 'POST',
                headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({
                    performanceTime: perfTimeVal,
                    ticketOpenTime: openTimeVal,
                    totalSeats: totalSeats,
                    seatPrice: seatPrice
                })
            });
            const data = await res.json();
            if (res.ok && data.success) {
                log(`[관리자] 회차 및 8x8 섹터 좌석 배치 자동 생성 성공!`);
                alert('회차 및 8x8 섹터 좌석 배치가 성공적으로 생성되었습니다!');
                closeAdminScheduleModal();
                selectPerformance(currentPerfId, currentPerfTitle);
            } else {
                alert(`생성 실패: ${data.message}`);
            }
        } catch (e) {
            log(`회차 생성 에러: ${e.message}`);
        }
    }

    async function submitAdminCreatePerformance() {
        const title = document.getElementById('newTitle').value.trim();
        const category = document.getElementById('newCategory').value;
        const venue = document.getElementById('newVenue').value.trim();
        const posterUrl = document.getElementById('newPosterUrl').value.trim();
        const runtimeMinutes = parseInt(document.getElementById('newRuntime').value) || 120;
        const bookIdVal = document.getElementById('newOriginalBookId').value.trim();
        const originalBookId = bookIdVal ? parseInt(bookIdVal) : null;
        const description = document.getElementById('newDescription').value.trim();

        if (!title || !venue) {
            alert('공연 제목과 공연장은 필수 입력값입니다.');
            return;
        }

        const payload = {
            title,
            category,
            venue,
            posterUrl,
            runtimeMinutes,
            description,
            originalBookId
        };

        try {
            const res = await fetch('/api/performances', {
                method: 'POST',
                headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (res.ok && data.success) {
                log(`[관리자] 신규 공연 등록 성공: ${title}`);
                closeAdminCreateModal();
                loadPerformances();
            } else {
                alert(`등록 실패: ${data.message}`);
            }
        } catch (e) {
            alert(`통신 에러: ${e.message}`);
        }
    }

    async function switchAccount(roleType) {
        try {
            const res = await fetch(`/api/performances/test-token?type=${roleType}`);
            const data = await res.json();
            if (res.ok && data.success && data.data && data.data.token) {
                localStorage.setItem('token', data.data.token);
                localStorage.setItem('accessToken', data.data.token);
                currentRole = data.data.role || roleType;
                updateRoleUI(currentRole, data.data.email);
                log(`[계정 스왑 성공] ${data.data.email} (${currentRole})`);
                await fetchMyReservationIds();
                await loadPerformances();
                if (currentScheduleId) {
                    await loadSeats(currentScheduleId);
                }
            } else {
                alert(`계정 스왑 실패: ${data.message || '토큰 수신 실패'}`);
            }
        } catch (e) {
            log(`[계정 스왑 실패] ${e.message}`);
            alert(`계정 스왑 에러: ${e.message}`);
        }
    }

    function updateRoleUI(role, email) {
        const badge = document.getElementById('userRoleBadge');
        if (badge) {
            badge.innerText = `현재 권한: ${role} (${email || ''})`;
            badge.style.background = role === 'ADMIN' ? '#8e44ad' : (role === 'GUEST' ? '#7f8c8d' : '#2c3e50');
        }
        const createBtn = document.getElementById('adminCreateBtn');
        const importBtn = document.getElementById('adminImportBtn');
        if (createBtn) {
            createBtn.style.display = (role === 'ADMIN') ? 'inline-block' : 'none';
        }
        if (importBtn) {
            importBtn.style.display = (role === 'ADMIN') ? 'inline-block' : 'none';
        }
    }

    let currentKopisCandidates = [];

    function importFromKopis() {
        document.getElementById('adminKopisModal').style.display = 'flex';
        executeKopisSearch();
    }

    function closeAdminKopisModal() {
        document.getElementById('adminKopisModal').style.display = 'none';
    }

    async function executeKopisSearch() {
        const keyword = document.getElementById('kopisSearchKeyword').value.trim() || '뮤지컬';
        const area = document.getElementById('kopisSearchResultArea');
        area.innerHTML = '<p style="color:#888; text-align:center;">KOPIS 검색 중...</p>';
        try {
            const res = await fetch(`/api/performances/admin/search/kopis?keyword=${encodeURIComponent(keyword)}`, {
                headers: getAuthHeaders()
            });
            const data = await res.json();
            if (res.ok && data.success) {
                currentKopisCandidates = data.data || [];
                if (currentKopisCandidates.length === 0) {
                    area.innerHTML = '<p style="color:#e74c3c; text-align:center;">검색 결과가 없습니다.</p>';
                    return;
                }
                let html = '<table style="width:100%; border-collapse:collapse; text-align:left; font-size:0.9rem;">';
                html += '<tr style="background:#f2f2f2;"><th style="padding:6px;"><input type="checkbox" onchange="toggleAllKopis(this)" checked></th><th style="padding:6px;">포스터</th><th style="padding:6px;">공연명</th><th style="padding:6px;">공연장</th><th style="padding:6px;">장르</th></tr>';
                currentKopisCandidates.forEach((item, index) => {
                    html += `<tr style="border-bottom:1px solid #eee;">
                        <td style="padding:6px;"><input type="checkbox" class="kopis-item-chk" value="${index}" checked></td>
                        <td style="padding:6px;"><img src="${item.poster}" style="width:40px; height:50px; object-fit:cover; border-radius:3px;"></td>
                        <td style="padding:6px; font-weight:bold; color:#2c3e50;">${item.prfnm}</td>
                        <td style="padding:6px; color:#555;">${item.fcltynm || '-'}</td>
                        <td style="padding:6px;"><span style="background:#e8f4fd; color:#3498db; padding:2px 6px; font-size:0.75rem; border-radius:3px;">${item.genrenm}</span></td>
                    </tr>`;

    async function submitSelectedKopisImport() {
        const checkedIndexes = Array.from(document.querySelectorAll('.kopis-item-chk:checked')).map(c => parseInt(c.value));
        if (checkedIndexes.length === 0) {
            alert('수집할 공연을 1개 이상 선택해 주세요.');
            return;
        }
        const selectedItems = checkedIndexes.map(idx => currentKopisCandidates[idx]);
        try {
            const res = await fetch('/api/performances/admin/import/kopis/select', {
                method: 'POST',
                headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify(selectedItems)
            });

            if (res.ok && data.success) {
                alert(`선택한 KOPIS 공연 수집 및 자동 회차/좌석 적재 완료! (${(data.data || []).length}건 DB 등록)`);

                loadPerformances();

                alert(`적재 실패: ${data.message}`);
            }
        } catch (e) {
            alert(`통신 에러: ${e.message}`);
        }

    function getAuthHeaders(extra) {
        let token = localStorage.getItem('token') || localStorage.getItem('accessToken');
        if (!token || token === 'undefined') token = '';
        return Object.assign({ 'Authorization': token ? 'Bearer ' + token : '' }, extra || {});
    }

    function selectCategory(category) {
        currentCategory = (currentCategory === category) ? null : category;
        setActiveCategory(currentCategory);
        loadPerformances();

    function setActiveCategory(active) {
        ['MUSICAL','CONCERT','CLASSIC','EXHIBITION'].forEach(c => {

            btn.style.opacity = (!active || active === c) ? '1' : '0.4';

    function log(msg) {
        const logBox = document.getElementById('logBox');

    async function loadPerformances() {
        const searchInput = document.getElementById('searchInput').value;
        const listEl = document.getElementById('performanceList');
        listEl.innerHTML = '<p>로딩 중...</p>';

        try {
            let url = '/api/performances';
            const params = new URLSearchParams();
            if (searchInput) params.append('keyword', searchInput);
            if (currentCategory) params.append('category', currentCategory);
            if (currentRole === 'ADMIN') params.append('includeInactive', 'true');
            if (params.toString()) url += '?' + params.toString();

            const res = await fetch(url);
            const data = await res.json();
            log(`GET ${url} -> HTTP ${res.status}`);
            
            const performances = (data && Array.isArray(data.data)) ? data.data : [];
            if (performances.length === 0) {
                listEl.innerHTML = '<p>조회된 공연이 없습니다.</p>';
                return;
            }
            listEl.innerHTML = '';
            performances.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                if (!p.active) {
                    card.style.opacity = '0.6';
                    card.style.border = '1px dashed #e74c3c';
                }
                
                let adminButtonsHtml = '';
                if (currentRole === 'ADMIN') {
                    const hardDeleteBtn = `<button onclick="event.stopPropagation(); hardDeletePerformance(${p.id}, '${p.title.replace(/'/g, "\\'")}');" style="background:#c0392b; font-size:0.75rem; padding:4px 8px; margin-left:4px;">영구 삭제</button>`;
                    if (p.active) {
                        adminButtonsHtml = `<button onclick="event.stopPropagation(); deactivatePerformance(${p.id});" style="background:#e74c3c; font-size:0.75rem; padding:4px 8px;">비활성화</button>` + hardDeleteBtn;
                    } else {
                        adminButtonsHtml = `<button onclick="event.stopPropagation(); activatePerformance(${p.id});" style="background:#2ecc71; font-size:0.75rem; padding:4px 8px;">재활성화(복구)</button>` + hardDeleteBtn;
                    }
                }

                const statusBadgeHtml = (!p.active) ? 
                    `<span style="background:#e74c3c; color:#fff; padding:3px 8px; font-size:0.8rem; font-weight:bold; margin-left:5px;">비활성화 됨</span>` : '';

                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <span class="badge">${p.category || '공연'}</span>
                            ${statusBadgeHtml}
                        </div>
                        <div>${adminButtonsHtml}</div>
                    </div>
                    <h3>${p.title} <span style="font-size:0.85rem; color:#64748b; font-weight:bold; margin-left:6px;">(${p.seatscale ? p.seatscale.toLocaleString() + '석' : '좌석 미정'})</span></h3>
                    <p style="margin:5px 0; font-size:0.9rem;">공연장: ${p.venue} (${p.runtimeMinutes}분)</p>
                    ${p.originalBookId ? 
						`<div style="margin:6px 0; font-size:0.85rem;">
                            <span style="color:#d35400; font-weight:bold;">원작 도서: </span>
                            <button onclick="event.stopPropagation(); location.href='/book-detail.html?id=${p.originalBookId}';" style="background:#e67e22; font-size:0.75rem; padding:3px 8px; margin-left:4px;">상세 보기 (ID: ${p.originalBookId})</button>
                        </div>` : ''}
                    <div style="margin-top:10px; display:flex; gap:8px;">
                        <button onclick="event.stopPropagation(); viewPerformanceDetail(${p.id});" style="background:#7f8c8d; font-size:0.8rem; padding:6px 10px;"> 상세보기</button>
                        ${p.active ? `<button onclick="event.stopPropagation(); selectPerformance(${p.id}, '${p.title}');" style="background:#3498db; font-size:0.8rem; padding:6px 10px;">예매하기</button>` : ''}
                    </div>
                `;
                listEl.appendChild(card);
            });
        } catch (e) {
            log(`에러 발생: ${e.message}`);
        }
    }

    async function hardDeletePerformance(perfId, perfTitle) {
        if (!confirm(`정말 공연 [${perfTitle}] 및 관련된 모든 회차/좌석/예매/장바구니 내역을 영구히 완전 삭제하시겠습니까?\n이 작업은 복구할 수 없습니다.`)) return;
        try {
            const res = await fetch(`/api/performances/${perfId}/hard`, {
                method: 'DELETE',
                headers: getAuthHeaders()
            });
            const data = await res.json();
            if (res.ok && data.success) {
                log(`[관리자] 공연 [${perfTitle}] 영구 완전 삭제 성공`);
                alert(`공연 [${perfTitle}] 이(가) DB에서 영구 완전 삭제되었습니다.`);
                document.getElementById('seatSection').style.display = 'none';
                loadPerformances();
            } else {
                alert(`삭제 실패: ${data.message}`);
            }
        } catch (e) {
            alert(`에러: ${e.message}`);
        }
    }

    async function deactivatePerformance(perfId) {
        if (!confirm('정말 해당 공연을 비활성화하시겠습니까?')) return;
        try {
            const res = await fetch(`/api/performances/${perfId}`, {
                method: 'DELETE',
                headers: getAuthHeaders()
            });
            const data = await res.json();
            if (res.ok && data.success) {
                log(`[관리자] 공연 ${perfId} 비활성화 성공`);
                loadPerformances();
            } else {
                alert(`비활성화 실패: ${data.message}`);
            }
        } catch (e) {
            alert(`에러: ${e.message}`);
        }
    }

    async function activatePerformance(perfId) {
        if (!confirm('해당 공연을 다시 활성화(복구)하시겠습니까?')) return;
        try {
            const res = await fetch(`/api/performances/${perfId}/activate`, {
                method: 'PATCH',
                headers: getAuthHeaders()
            });
            const data = await res.json();
            if (res.ok && data.success) {
                log(`[관리자] 공연 ${perfId} 재활성화(복구) 성공`);
                loadPerformances();
            } else {
                alert(`재활성화 실패: ${data.message}`);
            }
        } catch (e) {
            alert(`에러: ${e.message}`);
        }
    }

    async function loadSeats(scheduleId, zoneFilter) {
        currentScheduleId = scheduleId;
        if (zoneFilter !== undefined) {
            currentSelectedZone = zoneFilter;
        }

        document.querySelectorAll('#scheduleList button').forEach(b => {
            if (b.dataset.scheduleId == scheduleId) {
                b.style.background = '#0f172a';
                b.style.color = '#ffffff';
                b.style.borderColor = '#0f172a';
                b.style.fontWeight = 'bold';
            } else {
                b.style.background = '#ffffff';
                b.style.color = '#1e293b';
                b.style.borderColor = '#cbd5e1';
                b.style.fontWeight = 'normal';
            }
        });

        const seatAreaEl = document.getElementById('seatArea');
        seatAreaEl.style.display = 'block';
        seatAreaEl.scrollIntoView({ behavior: 'smooth' });

        try {
            await fetchMyReservationIds();
            const res = await fetch(`/api/performances/schedules/${scheduleId}/seats`);
            const data = await res.json();
            const allSeats = (data && Array.isArray(data.data)) ? data.data : [];
            log(`GET /api/performances/schedules/${scheduleId}/seats -> 좌석 상태 조회 (${allSeats.length}개)`);

            const grid = document.getElementById('seatsGrid');
            grid.innerHTML = '';
            grid.style.maxWidth = '850px';
            grid.style.margin = '0 auto';
            grid.style.padding = '15px';

            // 섹터 태그 및 각 섹터별 잔여 좌석 수 집계 ([1섹터 (1~64번)] 등)
            const sectorMap = new Map();
            allSeats.forEach(s => {
                if (s.seatNumber) {
                    const match = s.seatNumber.match(/\[(.*?)\]/) || s.seatNumber.match(/(.*?섹터|.*?구역)/);
                    if (match && match[1]) {
                        const secName = match[1];
                        if (!sectorMap.has(secName)) {
                            sectorMap.set(secName, { total: 0, available: 0, seats: [] });
                        }
                        const secInfo = sectorMap.get(secName);
                        secInfo.total++;
                        if (s.status === 'AVAILABLE') secInfo.available++;
                        secInfo.seats.push(s);
                    }
                }
            });

            // 1단계: 섹터 미선택 시 ➔ 64개 단위 섹터 블록 카드만 목록으로 표시
            if (!currentSelectedZone && sectorMap.size > 0) {
                const headerBox = document.createElement('div');
                headerBox.style.marginBottom = '20px';
                headerBox.style.textAlign = 'center';
                headerBox.innerHTML = `
                    <h3 style="margin:0 0 8px 0; color:#2c3e50;">📍 관람 섹터(블록) 선택</h3>
                    <p style="margin:0; color:#7f8c8d; font-size:0.9rem;">입장할 섹터 블록을 클릭하시면 해당 64개 좌석판(8x8 배치)이 나타납니다.</p>
                `;
                grid.appendChild(headerBox);

                const cardsContainer = document.createElement('div');
                cardsContainer.style.display = 'grid';
                cardsContainer.style.gridTemplateColumns = 'repeat(auto-fill, minmax(170px, 1fr))';
                cardsContainer.style.gap = '14px';
                cardsContainer.style.width = '100%';

                sectorMap.forEach((info, secName) => {
                    const card = document.createElement('div');
                    card.style.background = '#f8fafc';
                    card.style.border = '2px solid #cbd5e1';
                    card.style.borderRadius = '10px';
                    card.style.padding = '14px 10px';
                    card.style.cursor = 'pointer';
                    card.style.textAlign = 'center';
                    card.style.transition = 'all 0.2s ease';
                    card.style.boxShadow = '0 2px 6px rgba(0,0,0,0.05)';
                    card.style.wordBreak = 'keep-all';

                    card.onmouseover = () => {
                        card.style.borderColor = '#3498db';
                        card.style.background = '#ebf5fb';
                        card.style.transform = 'translateY(-2px)';
                    };
                    card.onmouseout = () => {
                        card.style.borderColor = '#cbd5e1';
                        card.style.background = '#f8fafc';
                        card.style.transform = 'translateY(0)';
                    };

                    card.onclick = () => loadSeats(scheduleId, secName);

                    card.innerHTML = `
                        <div style="font-weight:bold; font-size:0.95rem; color:#2c3e50; margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${secName}">${secName}</div>
                        <div style="font-size:0.8rem; color:#16a34a; font-weight:bold; margin-bottom:10px; white-space:nowrap;">잔여 ${info.available}석 / 총 ${info.total}석</div>
                        <button style="background:#3498db; color:#fff; border:none; padding:6px 14px; border-radius:5px; font-size:0.82rem; font-weight:bold; cursor:pointer; white-space:nowrap; display:inline-block;">입장하기 ➔</button>
                    `;
                    cardsContainer.appendChild(card);
                });

                grid.appendChild(cardsContainer);
                return;
            }

            // 2단계: 특정 섹터 선택 시 ➔ 상단 네비게이션 + 규격 맞춤 8x8 (64석) 좌석판 렌더링
            const topNav = document.createElement('div');
            topNav.style.width = '100%';
            topNav.style.marginBottom = '15px';
            topNav.style.padding = '12px 16px';
            topNav.style.background = '#edf2f7';
            topNav.style.border = '1px solid #cbd5e0';
            topNav.style.borderRadius = '8px';
            topNav.style.display = 'flex';
            topNav.style.alignItems = 'center';
            topNav.style.justifyContent = 'space-between';

            const activeZoneTitle = currentSelectedZone ? `📍 현재 구역: <span style="color:#2b6cb0; font-weight:bold;">${currentSelectedZone}</span>` : '전체 좌석 보기';
            topNav.innerHTML = `
                <div style="font-size:1rem; font-weight:bold; color:#2d3748;">${activeZoneTitle}</div>
                <button onclick="resetZoneSelection()" style="background:#4a5568; color:#fff; font-size:0.85rem; padding:6px 14px; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">← 전체 섹터 목록으로 돌아가기</button>
            `;
            grid.appendChild(topNav);

            const filteredSeats = allSeats.filter(seat => !currentSelectedZone || (seat.seatNumber && seat.seatNumber.includes(currentSelectedZone)));

            if (filteredSeats.length === 0) {
                const emptyMsg = document.createElement('p');
                emptyMsg.style.width = '100%';
                emptyMsg.style.color = '#999';
                emptyMsg.style.textAlign = 'center';
                emptyMsg.innerText = '해당 섹터에 좌석이 없습니다.';
                grid.appendChild(emptyMsg);
                return;
            }

            // 한 화면 규격에 딱 맞는 8x8 (64석) 전용 고정 콘테이너
            const seatContainer = document.createElement('div');
            seatContainer.style.display = 'grid';
            seatContainer.style.gridTemplateColumns = 'repeat(8, 1fr)';
            seatContainer.style.gap = '8px';
            seatContainer.style.width = '100%';
            seatContainer.style.maxWidth = '760px';
            seatContainer.style.margin = '0 auto';
            seatContainer.style.padding = '16px';
            seatContainer.style.background = '#1a202c';
            seatContainer.style.borderRadius = '12px';
            seatContainer.style.boxShadow = '0 6px 18px rgba(0,0,0,0.15)';

            filteredSeats.forEach(seat => {
                const btn = document.createElement('button');
                btn.className = `seat-btn seat-${(seat.status || 'AVAILABLE').toLowerCase()}`;
                btn.innerText = `${seat.seatNumber}\n(${(seat.price || 0).toLocaleString()}원)`;
                btn.style.fontSize = '0.75rem';
                btn.style.padding = '8px 4px';
                btn.style.minHeight = '52px';
                btn.onclick = () => handleSeatClick(seat);
                seatContainer.appendChild(btn);
            });

            grid.appendChild(seatContainer);
        } catch (e) {
            log(`좌석 로드 에러: ${e.message}`);
        }
    }

    async function handleSeatClick(seat) {
        if (seat.status === 'AVAILABLE') {
            try {
                const res = await fetch('/api/reservations/hold', {
                    method: 'POST',
                    headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({ scheduleId: currentScheduleId, seatId: seat.id })
                });
                if (res.status === 401) {
                    await switchAccount('USER');
                    return handleSeatClick(seat);
                }
                const data = await res.json();
                if (res.ok && data.success) {
                    lastReservationId = data.data.id;
                    lastHoldExpiresAt = data.data.holdExpiresAt;
                    log(`선점 성공 예매 ID: ${data.data.id}, 만료시각: ${data.data.holdExpiresAt}`);
                    await loadSeats(currentScheduleId, currentSelectedZone);
                    openCustomModal({
                        ...seat,
                        status: 'HELD',
                        reservationId: data.data.id,
                        holdExpiresAt: data.data.holdExpiresAt
                    });
                } else {
                    log(`선점 실패: ${data.message}`);
                    alert(`선점 실패: ${data.message || '좌석 선점 중 오류가 발생했습니다.'}`);
                }
            } catch (e) {
                log(`선점 에러: ${e.message}`);
                alert(`선점 실패: ${e.message}`);
            }
        } else if (seat.status === 'HELD' || seat.status === 'RESERVED') {
            if (!seat.reservationId || !myReservationIds.includes(seat.reservationId)) {
                alert('다른 사용자가 이미 선점 또는 예매 중인 좌석입니다.');
                return;
            }
            openCustomModal(seat);
        }
    }

    function goToTossCheckout() {
        if (!lastReservationId) {
            alert('예매 내역을 찾을 수 없습니다.');
            return;
        }
        location.href = `/payments/checkout?orderNumber=${lastReservationId}`;
    }

    function openCustomModal(seat) {
        if (seat && seat.reservationId) {
            lastReservationId = seat.reservationId;
        } else {
            lastReservationId = null;
        }
        
        if (seat && seat.holdExpiresAt) {
            lastHoldExpiresAt = seat.holdExpiresAt;
        } else {
            lastHoldExpiresAt = null;
        }

        const tossBtn = document.getElementById('btnTossPay');
        const confirmBtn = document.getElementById('btnConfirm');
        const cancelBtn = document.getElementById('btnCancel');

        if (seat.status === 'RESERVED') {
            document.getElementById('modalTitle').innerText = `${seat.seatNumber} 예매 취소`;
            document.getElementById('modalDesc').innerText = '이미 예매 확정이 완료된 좌석입니다. 예매를 취소하시겠습니까?';
            document.getElementById('modalTimer').style.display = 'none';
            if (tossBtn) tossBtn.style.display = 'none';
            if (confirmBtn) confirmBtn.style.display = 'none';
            cancelBtn.innerText = '예매 취소';
        } else {
            document.getElementById('modalTitle').innerText = `${seat.seatNumber} 선점 및 결제`;
            document.getElementById('modalDesc').innerText = '10분간 선점된 좌석입니다. 결제 방식을 선택하세요.';
            document.getElementById('modalTimer').style.display = 'block';
            if (tossBtn) tossBtn.style.display = 'block';
            if (confirmBtn) confirmBtn.style.display = 'block';
            cancelBtn.innerText = '선점 취소';
            startModalTimer();
        }
        document.getElementById('customModal').style.display = 'flex';
    }

    function closeCustomModal() {
        document.getElementById('customModal').style.display = 'none';
        if (modalTimerInterval) {
            clearInterval(modalTimerInterval);
            modalTimerInterval = null;
        }
    }

    function startModalTimer() {
        if (modalTimerInterval) clearInterval(modalTimerInterval);
        
        // 만료시각이 없으면 현재 시각 기준 10분 후로 자동 설정
        const expireTime = lastHoldExpiresAt 
            ? new Date(lastHoldExpiresAt).getTime() 
            : new Date().getTime() + (10 * 60 * 1000);
        
        const updateTimer = () => {
            const timerEl = document.getElementById('modalTimer');
            const diffMs = expireTime - new Date().getTime();
            if (diffMs <= 0) {
                timerEl.innerText = ' 선점 시간이 만료';
                clearInterval(modalTimerInterval);
                setTimeout(() => {
                    alert('선점 시간이 만료');
                    closeCustomModal();
                    loadSeats(currentScheduleId);
                }, 300);
                return;
            }
            const totalSec = Math.floor(diffMs / 1000);
            const min = String(Math.floor(totalSec / 60)).padStart(2, '0');
            const sec = String(totalSec % 60).padStart(2, '0');
			timerEl.innerHTML = `<span style="color:red; font-size:0.9rem; font-weight:normal;">
			선점시간동안 모든 작업이 완료되어야 합니다.</span><br><span style="color:black; font-size:1rem; font-weight:bold;">
			남은 선점시간: ${min}분 ${sec}초</span>`;        };

        updateTimer();
        modalTimerInterval = setInterval(updateTimer, 1000);
    }

    async function handleModalAction(action) {
        closeCustomModal();
        if (!action) return;
        if (!lastReservationId) {
            alert('해당 좌석의 예매 번호 정보를 찾을 수 없습니다.');
            return;
        }
        const endpoint = `/api/reservations/${lastReservationId}/${action}`;
        try {
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: getAuthHeaders()
            });
            //63. 반환된 값 포장 
            const data = await res.json();
            if (res.ok && data.success) {
                log(`[성공] ${action} 성공! 예매 상태: ${data.data.status}`);
                alert(`[${action} 성공] 처리되었습니다!`);
            } else {
                log(`[실패] ${action} 실패: ${data.message}`);
                alert(`[실패] ${data.message}`);
            }
            //64. 좌석상태 다시 로딩 
            loadSeats(currentScheduleId);
        } catch (e) {
            log(`에러: ${e.message}`);
        }
    }

    function parseJwtToken(token) {
        try {
            if (!token) return null;
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        } catch (e) {
            return null;
        }
    }

    // 자동실행
    async function initPage() {
        let token = localStorage.getItem('token') || localStorage.getItem('accessToken');
        if (!token || token === 'undefined') {
            await switchAccount('ADMIN');
        } else {
            const decoded = parseJwtToken(token);
            if (decoded) {
                currentRole = decoded.role || 'ADMIN';
                const email = decoded.sub || '';
                updateRoleUI(currentRole, email);
            } else {
                await switchAccount('ADMIN');
            }
        }
        await loadPerformances();
        const urlParams = new URLSearchParams(window.location.search);
        const perfId = urlParams.get('perfId');
        const scheduleId = urlParams.get('scheduleId');
        if (perfId && scheduleId) {
            try {
                log(`[자동 연동] perfId=${perfId}, scheduleId=${scheduleId} 좌석판 자동 오픈 시도`);
                const res = await fetch(`/api/performances/${perfId}`);
                const data = await res.json();
                const title = (data && data.success && data.data) ? data.data.title : '';
                await selectPerformance(perfId, title);
                await loadSeats(scheduleId);
                setTimeout(() => {
                    const grid = document.getElementById('seatsGrid');
                    if (grid) grid.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 200);
            } catch (e) {
                log(`자동 회차 로드 에러: ${e.message}`);
            }
        }
        initWebSocket();
    }

    function initWebSocket() {
        try {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/seats`;
            const socket = new WebSocket(wsUrl);
            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    if (currentScheduleId && data.scheduleId == currentScheduleId) {
                        log(`[웹소켓 0.05초 실시간 수신] 좌석 #${data.seatId} 상태 변경: ${data.status}`);
                        loadSeats(currentScheduleId, currentSelectedZone);
                    }
                } catch (e) {}
            };
            socket.onclose = function() {
                setTimeout(initWebSocket, 2000);
            };
        } catch (e) {
            console.error('웹소켓 연결 오류:', e);
        }
    }

    initPage();
</script>
