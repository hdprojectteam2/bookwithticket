<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테스트</title>
    <style>
        * { box-sizing: border-box; font-family:  sans-serif; text-decoration: none !important; }
        body { background-color: grey; margin: 0; padding: 20px; color: black }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 25px;  }
        h1 { margin-top: 0; color: black; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .section { margin-bottom: 30px; }
        h2 { color: #34495e; font-size: 1.2rem; margin-bottom: 12px; }
        .search-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; font-size: 1rem; }
        button { background: #3498db; color: #fff; border: none; padding: 10px 18px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #2980b9; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .card { border: 1px solid #e0e0e0; padding: 15px; background: #fafafa; cursor: pointer; transition: 0.2s; }
        .card:hover { border-color: #3498db; background: #f0f7fc; transform: translateY(-2px); }
        .card h3 { margin: 0 0 8px 0; color: grey; }
        .badge { display: inline-block; background: #e8f4fd; color: #3498db; padding: 3px 8px;  font-size: 0.8rem; font-weight: bold; }
        .seats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; max-width: 400px; margin-top: 15px; }
        .seat-btn { padding: 15px; text-align: center; cursor: pointer; font-weight: bold; color: #fff; border: none; }
        .seat-available { background: #2ecc71; }
        .seat-held { background: #f39c12; }
        .seat-reserved { background: #e74c3c; }
        .log-box { background: #1e1e1e; color:white; padding: 15px; font-family: monospace; height: 180px; overflow-y: auto; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>테스트</h1>

    <!--검색-->
    <div class="section">
        <h2>공연 검색, 목록</h2>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="제목입력" onkeyup="if(event.key === 'Enter') loadPerformances();">
            <button onclick="loadPerformances()">검색</button>
            <button onclick="document.getElementById('searchInput').value=''; loadPerformances();" style="background:#95a5a6;">전체보기</button>
        </div>
        <div id="performanceList" class="grid">로딩</div>
    </div>

    <!-- 회차 좌석 선택, 밑에 loadPerformances 에서 실행됨  -->
    <div class="section" id="seatSection" style="display:none;">
        <h2> 회차 선택과 좌석 선점 (<span id="selectedPerfTitle" style="color:#3498db;"></span>)</h2>
        <div id="scheduleList" style="margin-bottom:15px;"></div>
        <div id="seatArea" style="display:none;">
            <h3>좌석 선택 (<span style="color:#2ecc71;">GREEN</span> 예매가능 | <span style="color:#f39c12;">YELLOW</span> 10분선점 | <span style="color:#e74c3c;">RED</span> 예매완료)</h3>
            <div id="seatsGrid" class="seats-grid"></div>
        </div>
    </div>

    <!-- 결과확인용 -->
    <div class="section">
        <h2>로그</h2>
        <div id="logBox" class="log-box">로드 완료 </div>
    </div>
</div>

<!-- 선점 좌석   -->
<div id="customModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#fff; padding:25px; width:360px; text-align:center; border:1px solid #ccc;">
        <h3 id="modalTitle" style="margin-top:0; color:#2c3e50;">선점된 좌석 처리</h3>
        <p id="modalDesc" style="color:#666; font-size:0.8rem; margin-bottom:10px;">선점 좌석 처리 여부</p>
		<p id="modalTimer" style="margin:10px 0; line-height:1.4;"></p>
        <div style="display:flex; gap:10px; justify-content:center; margin-top:15px;">
            <button id="btnConfirm" onclick="handleModalAction('confirm')" style="background:#2ecc71; flex:1;">예매 확정</button>
            <button id="btnCancel" onclick="handleModalAction('cancel')" style="background:#e74c3c; flex:1;">선점 취소</button>
            <button onclick="closeCustomModal()" style="background:#95a5a6;">닫기</button>
        </div>
    </div>
</div>

<script>
    let currentScheduleId = null;
    let lastReservationId = null;
    let lastHoldExpiresAt = null;
    let modalTimerInterval = null;
	
    function log(msg) {
        const logBox = document.getElementById('logBox');
        logBox.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}<br>` + logBox.innerHTML;
    }

    async function loadPerformances() {
        const keyword = document.getElementById('searchInput').value.trim();
		
        const url = keyword ? `/api/performances?keyword=${encodeURIComponent(keyword)}` : '/api/performances';
        
        try {
			//1. 검색시 performancecontroller로 출발, 
            const res = await fetch(url);
			//8. 받아온걸 조립함 
            const data = await res.json();
            
			//실패시 예외처리
            if (!res.ok || (data && data.success === false)) {
                log(`[실패] GET ${url} -> HTTP ${res.status} : ${data ? data.message : '요청 실패'}`);
                document.getElementById('performanceList').innerHTML = `<p style="color:red;">오류: ${data ? data.message : '요청 실패'}</p>`;
                return;
            }
			
			//성공시 로그 
            log(`GET ${url} -> HTTP ${res.status}`);
			
			//이전 문자들 제거하기 
            const listEl = document.getElementById('performanceList');
            listEl.innerHTML = '';
			
			
			//9. 받아온 데이터중에 필요한거를 변수에 
            const performances = (data && Array.isArray(data.data)) ? data.data : [];
			
			
			//조회했는데 없으면 , 처음 설정 
            if (performances.length === 0) {
                listEl.innerHTML = '<p>조회된 공연이 없습니다.</p>';
                return;
            }
            //10. 받아온걸 그림 
            performances.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <span class="badge">${p.category || '공연'}</span>
                    <h3>${p.title}</h3>
                    <p style="margin:5px 0; font-size:0.9rem;">공연장: ${p.venue} (${p.runtimeMinutes}분)</p>
                    <p style="margin:5px 0; font-size:0.85rem; color:#666;">${p.description || ''}</p>
                    ${p.originalBookId ? 
						`<p style="margin:5px 0; color:#e67e22; font-size:0.85rem; font-weight:bold;">원작 도서 ID: ${p.originalBookId}</p>` : ''}
                    <div style="margin-top:10px; display:flex; gap:8px;">
                        <button onclick="event.stopPropagation(); viewPerformanceDetail(${p.id});" style="background:#7f8c8d; font-size:0.8rem; padding:6px 10px;"> 상세보기</button>
                        <button onclick="event.stopPropagation(); selectPerformance(${p.id}, '${p.title}');" style="background:#3498db; font-size:0.8rem; padding:6px 10px;">예매하기</button>
                    </div>
                `;
                listEl.appendChild(card);
            });
        } catch (e) {
            log(`에러 발생: ${e.message}`);
        }
    }
	// 세부정보 페이지 
    function viewPerformanceDetail(perfId) {
        location.href = `/detail.html?id=${perfId}`;
    }

    async function selectPerformance(perfId, perfTitle) {
		// 12. 누른 항목 제목을 넣어주고 회차선택 보여줌
        document.getElementById('selectedPerfTitle').innerText = perfTitle;
        document.getElementById('seatSection').style.display = 'block';
        document.getElementById('seatArea').style.display = 'none';

        try {
			//13. controller로 다시 이동
            const res = await fetch(`/api/performances/${perfId}/schedules`);
			//20. 받아온걸 조립함 
            const data = await res.json();
			//21. 데이터를 대입함 
            const schedules = (data && Array.isArray(data.data)) ? data.data : [];
			//22. 데이터 개수 로그 
            log(`GET /api/performances/${perfId}/schedules -> ${schedules.length}개 회차 발견`);
			
			//23. scheduleList에 내용 넣음
            const schEl = document.getElementById('scheduleList');
            schEl.innerHTML = '<b>회차 선택: </b>';
			
			//24. 출력함 
            schedules.forEach(s => {
                const btn = document.createElement('button');
                btn.style.marginRight = '8px';
                btn.dataset.scheduleId = s.id;
                btn.innerText = new Date(s.performanceTime).toLocaleString('ko-KR', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
                //25. 좌석 출력 실행
				btn.onclick = () => loadSeats(s.id);
                schEl.appendChild(btn);
            });
        } catch (e) {
            log(`회차 로드 에러: ${e.message}`);
        }
    }
	//26. 좌석 출력 함수 
    async function loadSeats(scheduleId) {
		//27. 좌석 선택 보여줌
        currentScheduleId = scheduleId;
        document.querySelectorAll('#scheduleList button').forEach(b => {
            if (b.dataset.scheduleId == scheduleId) {
                b.style.background = '#2c3e50';
                b.style.color = '#fff';
                b.style.fontWeight = 'bold';
                b.style.outline = '2px solid #16a085';
            } else {
                b.style.background = '#3498db';
                b.style.color = '#fff';
                b.style.fontWeight = 'normal';
                b.style.outline = 'none';
            }
        });
        document.getElementById('seatArea').style.display = 'block';

        try {
			//28. reservationcontroller로 이동 
            const res = await fetch(`/api/performances/schedules/${scheduleId}/seats`);
			//38. 받아온걸 조립 
            const data = await res.json();
            const seats = (data && Array.isArray(data.data)) ? data.data : [];
			//로그 
            log(`GET /api/performances/schedules/${scheduleId}/seats -> 좌석 상태 조회 (${seats.length}개)`);
			//내용비움
            const grid = document.getElementById('seatsGrid');
            grid.innerHTML = '';
			
			//39. 출력,  각각 버튼 만들어주고 상태에따라 색 만듬 
            seats.forEach(seat => {
                const btn = document.createElement('button');
                btn.className = `seat-btn seat-${(seat.status || 'AVAILABLE').toLowerCase()}`;
                btn.innerText = `${seat.seatNumber}\n(${(seat.price || 0).toLocaleString()}원)`;
				//40. 좌석 선택시 
                btn.onclick = () => handleSeatClick(seat);
                grid.appendChild(btn);
            });
        } catch (e) {
            log(`좌석 로드 에러: ${e.message}`);
        }
    }

    async function handleSeatClick(seat) {
		//41. 좌석 접근 가능시
        if (seat.status === 'AVAILABLE') {
			//42. 일반적인 선택 
            if (!confirm(`${seat.seatNumber} 좌석을 10분간 선점하시겠습니까?`)) return;
            
            try {
				//43. reservationcontroller로 선점 사실을 보냄 
                const res = await fetch('/api/reservations/hold', 	{
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Member-Id': '1' },
                    body: JSON.stringify({ scheduleId: currentScheduleId, seatId: seat.id })
                });
				//52. 데이터 받음 
                const data = await res.json();
				//53/ http 코드가 성공인지, data 가 success인지 
                if (res.ok && data.success) {
                    lastReservationId = data.data.id;
                    lastHoldExpiresAt = data.data.holdExpiresAt;
                    log(`선점 성공 예매 ID: ${data.data.id}, 만료시각: ${data.data.holdExpiresAt}`);
                    alert(` 10분간 선점 성공 (예매 ID: ${data.data.id})`);
                } else {
                    log(`선점 실패: ${data.message}`);
                    alert(`선점 실패 ${data.message}`);
                }
				//54. 재호출해서 상황을 바꿈 
                loadSeats(currentScheduleId);
            } catch (e) {
                log(`선점 에러: ${e.message}`);
            }
			//55. 홀드중일경우 
        } else if (seat.status === 'HELD' || seat.status === 'RESERVED') {
            openCustomModal(seat);
        }
    }

    function openCustomModal(seat) {
        if (seat.reservationId) {
            lastReservationId = seat.reservationId;
        }
        if (seat.status === 'RESERVED') {
            document.getElementById('modalTitle').innerText = `${seat.seatNumber} 예매 취소`;
            document.getElementById('modalDesc').innerText = '이미 예매 확정이 완료된 좌석입니다. 예매를 취소하시겠습니까?';
            document.getElementById('modalTimer').style.display = 'none';
            document.getElementById('btnConfirm').style.display = 'none';
            document.getElementById('btnCancel').innerText = '예매 취소';
        } else {
            document.getElementById('modalTitle').innerText = `${seat.seatNumber} 선점 처리`;
            document.getElementById('modalDesc').innerText = '10분간 선점된 좌석입니다. 처리 항목을 선택하세요.';
            document.getElementById('modalTimer').style.display = 'block';
            document.getElementById('btnConfirm').style.display = 'block';
            document.getElementById('btnCancel').innerText = '선점 취소';
            if (seat.holdExpiresAt) {
                lastHoldExpiresAt = seat.holdExpiresAt;
            }
            startModalTimer();
        }
        document.getElementById('customModal').style.display = 'flex';
    }

    function closeCustomModal() {
        document.getElementById('customModal').style.display = 'none';
        if (modalTimerInterval) {
            clearInterval(modalTimerInterval);
            modalTimerInterval = null;
        }
    }

    function startModalTimer() {
        if (modalTimerInterval) clearInterval(modalTimerInterval);
        
        // 만료시각이 없으면 현재 시각 기준 10분 후로 자동 설정
        const expireTime = lastHoldExpiresAt 
            ? new Date(lastHoldExpiresAt).getTime() 
            : new Date().getTime() + (10 * 60 * 1000);
        
        const updateTimer = () => {
            const timerEl = document.getElementById('modalTimer');
            const diffMs = expireTime - new Date().getTime();
            if (diffMs <= 0) {
                timerEl.innerText = ' 선점 시간이 만료';
                clearInterval(modalTimerInterval);
                setTimeout(() => {
                    alert('선점 시간이 만료');
                    closeCustomModal();
                    loadSeats(currentScheduleId);
                }, 300);
                return;
            }
            const totalSec = Math.floor(diffMs / 1000);
            const min = String(Math.floor(totalSec / 60)).padStart(2, '0');
            const sec = String(totalSec % 60).padStart(2, '0');
			timerEl.innerHTML = `<span style="color:red; font-size:0.9rem; font-weight:normal;">
			선점시간동안 모든 작업이 완료되어야 합니다.</span><br><span style="color:black; font-size:1rem; font-weight:bold;">
			남은 선점시간: ${min}분 ${sec}초</span>`;        };

        updateTimer();
        modalTimerInterval = setInterval(updateTimer, 1000);
    }

    async function handleModalAction(action) {
        closeCustomModal();
        //56. 취소선택하거나 자기가 선점한게 아닌경우 
        if (!action || !lastReservationId) return;
        //57. reservationcontroller로 이동 
        const endpoint = `/api/reservations/${lastReservationId}/${action}`;
        try {
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'X-Member-Id': '1' }
            });
            //63. 반환된 값 포장 
            const data = await res.json();
            if (res.ok && data.success) {
                log(`[성공] ${action} 성공! 예매 상태: ${data.data.status}`);
                alert(`[${action} 성공] 처리되었습니다!`);
            } else {
                log(`[실패] ${action} 실패: ${data.message}`);
                alert(`[실패] ${data.message}`);
            }
            //64. 좌석상태 다시 로딩 
            loadSeats(currentScheduleId);
        } catch (e) {
            log(`에러: ${e.message}`);
        }
    }

    // 자동실행
    async function initPage() {
        await loadPerformances();
        const urlParams = new URLSearchParams(window.location.search);
        const perfId = urlParams.get('perfId');
        const scheduleId = urlParams.get('scheduleId');
        if (perfId && scheduleId) {
            try {
                log(`[자동 연동] perfId=${perfId}, scheduleId=${scheduleId} 좌석판 자동 오픈 시도`);
                const res = await fetch(`/api/performances/${perfId}`);
                const data = await res.json();
                const title = (data && data.success && data.data) ? data.data.title : '';
                await selectPerformance(perfId, title);
                await loadSeats(scheduleId);
                setTimeout(() => {
                    const grid = document.getElementById('seatsGrid');
                    if (grid) grid.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 200);
            } catch (e) {
                log(`자동 회차 로드 에러: ${e.message}`);
            }
        }
    }
    initPage();
</script>
</body>
</html>
