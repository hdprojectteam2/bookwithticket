<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <title>회원정보 수정</title>

    <link rel="stylesheet" href="/css/style.css">

</head>


<body>


<h1>회원정보 수정</h1>



<div class="update-box">


    <div>

        <label>
            이메일
        </label>

        <p id="email">
            -
        </p>

    </div>



    <div>

        <label>
            이름
        </label>

        <input
                id="name"
                type="text"
        >

    </div>




    <div>

        <label>
            전화번호
        </label>

        <input
                id="phone"
                type="text"
        >

    </div>




    <div>

        <label>
            우편번호
        </label>

        <input
                id="zipcode"
                type="text"
        >

    </div>




    <div>

        <label>
            주소
        </label>

        <input
                id="address"
                type="text"
        >

    </div>




    <div>

        <label>
            상세주소
        </label>

        <input
                id="detailAddress"
                type="text"
        >

    </div>





    <div>

        <label>
            새 비밀번호
        </label>

        <input
                id="password"
                type="password"
                placeholder="변경할 때만 입력"
        >

    </div>




    <button onclick="updateMember()">

        수정하기

    </button>


</div>





<script src="/js/member-update.js"></script>


</body>

</html>
