<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookWithTicket - 통합 메인</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            text-decoration: none;
        }

        body {
            background-color: #f8f9fa;
            color: #212529;
        }

        .top-utility-bar {
            background-color: #f1f3f5;
            border-bottom: 1px solid #dee2e6;
            padding: 8px 40px;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            font-size: 0.85rem;
        }

        .top-utility-bar a {
            color: #495057;
        }

        .top-utility-bar a:hover {
            color: #000000;
        }

        .main-header {
            background-color: #ffffff;
            border-bottom: 2px solid #343a40;
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #212529;
        }

        .header-menu {
            display: flex;
            align-items: center;
            gap: 25px;
            list-style: none;
        }

        .header-menu a {
            color: #343a40;
            font-size: 1rem;
            font-weight: bold;
        }

        .header-menu a:hover {
            color: #0d6efd;
        }

        .container {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 20px;
        }

        .search-section {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            padding: 25px;
            margin-bottom: 25px;
        }

        .search-form {
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 12px 15px;
            font-size: 1rem;
            border: 1px solid #ced4da;
            outline: none;
        }

        .search-btn {
            background-color: #212529;
            color: #ffffff;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            cursor: pointer;
        }

        .search-btn:hover {
            background-color: #343a40;
        }

        .shortcut-section {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn-shortcut {
            flex: 1;
            background-color: #343a40;
            color: #ffffff;
            text-align: center;
            padding: 15px;
            font-size: 1.05rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .btn-shortcut:hover {
            background-color: #0d6efd;
        }

        .stats-summary-bar {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            padding: 20px;
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-bottom: 35px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #6c757d;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #0d6efd;
        }

        .section-block {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #212529;
            border-bottom: 2px solid #212529;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .item-card {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-card h4 {
            font-size: 1.05rem;
            color: #212529;
            margin-bottom: 8px;
        }

        .item-card p {
            font-size: 0.85rem;
            color: #6c757d;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .btn-card {
            display: inline-block;
            background-color: #f1f3f5;
            color: #212529;
            border: 1px solid #ced4da;
            padding: 8px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .btn-card:hover {
            background-color: #e9ecef;
        }
    </style>
</head>
<body>

<div class="top-utility-bar" id="topUtilityBar">
    <span id="authLinks">
        <a href="/login.html">로그인</a>
        <span>|</span>
        <a href="/signup.html">회원가입</a>
    </span>
    <span>|</span>
    <a href="/mypage.html">마이페이지</a>
    <span>|</span>
    <a href="#">고객센터</a>
</div>

<header class="main-header">
    <a href="/mainpage.html" class="brand-title">BookWithTicket</a>
    <ul class="header-menu">
        <li><a href="/books.html">도서</a></li>
        <li><a href="/index.html">공연</a></li>
        <li><a href="/cart">장바구니</a></li>
        <li><a href="/mypage.html">마이페이지</a></li>
    </ul>
</header>

<div class="container">
    
    <div class="search-section">
        <div class="search-form">
            <input type="text" id="searchInput" class="search-input" placeholder="통합 검색 (도서명 또는 공연 제목 입력) (기능 미연동)">
            <button class="search-btn">검색</button>
        </div>
    </div>

    <div class="shortcut-section">
        <a href="/books.html" class="btn-shortcut">도서 둘러보기</a>
        <a href="/index.html" class="btn-shortcut">공연 검색하기</a>
    </div>

    <div class="stats-summary-bar">
        <div class="stat-item">
            <span class="stat-label">등록 도서</span>
            <span class="stat-value" id="bookCountVal">- 권</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">등록 공연</span>
            <span class="stat-value" id="perfCountVal">- 개</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">전체 회원수</span>
            <span class="stat-value" id="memberCountVal">150 명</span>
        </div>
    </div>

    <div class="section-block">
        <div class="section-title">인기도서</div>
        <div id="bookListGrid" class="content-grid">
            <p>도서 데이터를 불러오는 중입니다...</p>
        </div>
    </div>

    <div class="section-block">
        <div class="section-title">인기공연</div>
        <div id="perfListGrid" class="content-grid">
            <p>공연 데이터를 불러오는 중입니다...</p>
        </div>
    </div>

</div>

<script>
    async function loadStatsAndData() {
        try {
            const res = await fetch('/books');
            if (res.ok) {
                const books = await res.json();
                const bookList = Array.isArray(books) ? books : [];
                document.getElementById('bookCountVal').innerText = `${bookList.length} 권`;
                renderBooks(bookList);
            } else {
                document.getElementById('bookListGrid').innerHTML = '<p>도서 목록을 가져올 수 없습니다.</p>';
            }
        } catch (e) {
            document.getElementById('bookListGrid').innerHTML = `<p>도서 조회 에러: ${e.message}</p>`;
        }

        try {
            const res = await fetch('/api/performances');
            const data = await res.json();
            if (res.ok && data && Array.isArray(data.data)) {
                const perfs = data.data;
                document.getElementById('perfCountVal').innerText = `${perfs.length} 개`;
                renderPerformances(perfs);
            } else {
                document.getElementById('perfListGrid').innerHTML = '<p>공연 목록을 가져올 수 없습니다.</p>';
            }
        } catch (e) {
            document.getElementById('perfListGrid').innerHTML = `<p>공연 조회 에러: ${e.message}</p>`;
        }
    }

    function renderBooks(books) {
        const grid = document.getElementById('bookListGrid');
        grid.innerHTML = '';
        if (books.length === 0) {
            grid.innerHTML = '<p>등록된 도서가 없습니다.</p>';
            return;
        }
        books.forEach(b => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerHTML = `
                <div>
                    <h4>${b.title}</h4>
                    <p>저자: ${b.author || '미상'}<br>출판사: ${b.publisher || '미상'}</p>
                </div>
                <a href="/book-detail.html?id=${b.id}" class="btn-card">도서 상세보기</a>
            `;
            grid.appendChild(card);
        });
    }

    function renderPerformances(perfs) {
        const grid = document.getElementById('perfListGrid');
        grid.innerHTML = '';
        if (perfs.length === 0) {
            grid.innerHTML = '<p>등록된 공연이 없습니다.</p>';
            return;
        }
        perfs.forEach(p => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerHTML = `
                <div>
                    <h4>${p.title}</h4>
                    <p>카테고리: ${p.category}<br>장소: ${p.venue} (${p.runtimeMinutes}분)</p>
                </div>
                <a href="/detail.html?id=${p.id}" class="btn-card">공연 예매하기</a>
            `;
            grid.appendChild(card);
        });
    }

    function parseJwtToken(token) {
        try {
            if (!token) return null;
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const payload = JSON.parse(atob(base64));
            return payload;
        } catch (e) {
            return null;
        }
    }

    function checkAuthStatus() {
        const token = localStorage.getItem('token') || localStorage.getItem('accessToken');
        const authLinks = document.getElementById('authLinks');
        if (!authLinks) return;

        if (token && token !== 'undefined') {
            const payload = parseJwtToken(token);
            const userEmail = payload ? (payload.sub || payload.email || '') : '';
            const role = payload ? (payload.role || '') : '';
            const userDisplay = userEmail ? `<span style="font-weight:bold; color:#2c3e50; margin-right:8px;">${userEmail} 님</span>` : '';
            
            let adminLinks = '';
            if (role === 'ADMIN' || role === 'ROLE_ADMIN') {
                adminLinks = ` <span>|</span> <a href="/admin.html" style="color:#8e44ad; font-weight:bold;">도서 관리자</a> <span>|</span> <a href="/admin/orders" style="color:#27ae60; font-weight:bold;">주문/배송 관리자</a>`;
            }

            authLinks.innerHTML = `${userDisplay}<a href="#" onclick="logout(); return false;">로그아웃</a>${adminLinks}`;
        } else {
            authLinks.innerHTML = `<a href="/login.html">로그인</a> <span>|</span> <a href="/signup.html">회원가입</a>`;
        }
    }

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('accessToken');
        alert('로그아웃 되었습니다.');
        location.reload();
    }

    checkAuthStatus();
    loadStatsAndData();
</script>

</body>
</html>
